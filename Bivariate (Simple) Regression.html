<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regression Learning Lab — Bivariate Regression</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap');

/* ══════════════════════════════════════════════
   DESIGN SYSTEM — Warm Academic Editorial
   ══════════════════════════════════════════════ */
:root {
  --bg: #faf8f4;
  --bg-warm: #f5f1ea;
  --surface: #ffffff;
  --surface-alt: #f0ece4;
  --border: #e2ddd4;
  --border-dark: #c9c2b6;
  --text: #2c2a26;
  --text-mid: #5a564e;
  --text-dim: #8a857b;
  --ink: #1a1815;
  --accent: #b44c2a;
  --accent-light: #d4724f;
  --accent-bg: rgba(180,76,42,0.06);
  --accent-border: rgba(180,76,42,0.2);
  --blue: #2a6cb4;
  --blue-bg: rgba(42,108,180,0.06);
  --blue-border: rgba(42,108,180,0.2);
  --green: #2a7d4f;
  --green-bg: rgba(42,125,79,0.07);
  --green-border: rgba(42,125,79,0.25);
  --red: #b43a3a;
  --red-bg: rgba(180,58,58,0.06);
  --red-border: rgba(180,58,58,0.2);
  --gold: #96782a;
  --gold-bg: rgba(150,120,42,0.08);
  --gold-border: rgba(150,120,42,0.25);
  --purple: #6b4fa0;
  --purple-bg: rgba(107,79,160,0.06);
  --font-display: 'Crimson Pro', Georgia, serif;
  --font-body: 'Outfit', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.07);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.08);
  --radius: 10px;
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

/* ── LAYOUT ── */
.app { max-width: 820px; margin: 0 auto; padding: 20px; }

/* ── SIDEBAR NAV ── */
.top-nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(250,248,244,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 10px 0;
  margin: 0 -20px;
  padding-left: 20px;
  padding-right: 20px;
}
.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 820px;
  margin: 0 auto;
}
.nav-title {
  font-family: var(--font-display);
  font-size: 1.05em;
  font-weight: 700;
  color: var(--ink);
}
.nav-progress {
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav-progress-text {
  font-family: var(--font-mono);
  font-size: 0.7em;
  color: var(--text-dim);
}
.nav-bar {
  width: 120px;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.nav-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.5s ease;
}

/* ── MODULE NAVIGATION ── */
.module-nav {
  display: flex;
  gap: 4px;
  margin: 18px 0;
  flex-wrap: wrap;
}
.module-dot {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.65em;
  font-weight: 600;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
}
.module-dot:hover { border-color: var(--accent); color: var(--accent); }
.module-dot.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.module-dot.completed {
  background: var(--green);
  border-color: var(--green);
  color: white;
}

/* ── HERO ── */
.hero {
  text-align: center;
  padding: 60px 20px 40px;
}
.hero-label {
  font-family: var(--font-mono);
  font-size: 0.65em;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 14px;
}
.hero h1 {
  font-family: var(--font-display);
  font-size: 2.8em;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.15;
  margin-bottom: 16px;
}
.hero p {
  font-size: 1.05em;
  color: var(--text-mid);
  max-width: 560px;
  margin: 0 auto 30px;
  line-height: 1.7;
}

/* ── CARDS / PANELS ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  margin: 16px 0;
  box-shadow: var(--shadow-sm);
}

.teach-panel {
  border-left: 3px solid var(--accent);
  background: var(--surface);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 24px 28px;
  margin: 18px 0;
  box-shadow: var(--shadow-sm);
}

.concept-box {
  border: 1px solid var(--blue-border);
  background: var(--blue-bg);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin: 16px 0;
}
.concept-box .cb-label {
  font-family: var(--font-mono);
  font-size: 0.65em;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 8px;
}

.mistake-box {
  border: 1px solid var(--red-border);
  background: var(--red-bg);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin: 16px 0;
}
.mistake-box .mb-label {
  font-family: var(--font-mono);
  font-size: 0.65em;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 8px;
}

.insight-box {
  border: 1px solid var(--gold-border);
  background: var(--gold-bg);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin: 16px 0;
}
.insight-box .ib-label {
  font-family: var(--font-mono);
  font-size: 0.65em;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 8px;
}

.success-box {
  border: 1px solid var(--green-border);
  background: var(--green-bg);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin: 16px 0;
}
.success-box .sb-label {
  font-family: var(--font-mono);
  font-size: 0.65em;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 8px;
}

/* ── TYPOGRAPHY ── */
.mod-header {
  font-family: var(--font-display);
  font-size: 1.9em;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 6px;
  line-height: 1.2;
}
.mod-sub {
  font-family: var(--font-mono);
  font-size: 0.7em;
  color: var(--accent);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 20px;
}
h3 {
  font-family: var(--font-display);
  font-size: 1.3em;
  font-weight: 700;
  color: var(--ink);
  margin: 24px 0 10px;
}
p { margin-bottom: 12px; }
strong { font-weight: 600; color: var(--ink); }
code {
  font-family: var(--font-mono);
  font-size: 0.85em;
  background: var(--surface-alt);
  padding: 2px 7px;
  border-radius: 4px;
  color: var(--accent);
}
.formula {
  font-family: var(--font-mono);
  font-size: 0.95em;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 20px;
  margin: 14px 0;
  text-align: center;
  color: var(--ink);
  line-height: 1.8;
}

/* ── INTERACTIVE ELEMENTS ── */
.interactive-zone {
  background: var(--bg-warm);
  border: 1.5px dashed var(--border-dark);
  border-radius: var(--radius);
  padding: 24px;
  margin: 18px 0;
}
.iz-label {
  font-family: var(--font-mono);
  font-size: 0.65em;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.slider-group {
  margin: 14px 0;
}
.slider-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.85em;
  margin-bottom: 5px;
}
.slider-label .sl-name { font-weight: 600; color: var(--ink); }
.slider-label .sl-val {
  font-family: var(--font-mono);
  color: var(--accent);
  font-weight: 600;
}
input[type="range"] {
  width: 100%;
  height: 6px;
  -webkit-appearance: none;
  appearance: none;
  background: var(--border);
  border-radius: 3px;
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(180,76,42,0.3);
}

/* ── CANVAS ── */
canvas.graph {
  width: 100%;
  height: 260px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: white;
  display: block;
  margin: 10px 0;
}

/* ── STATA OUTPUT ── */
.stata-output {
  background: #1e1e2a;
  border-radius: 8px;
  padding: 18px;
  margin: 14px 0;
  font-family: var(--font-mono);
  font-size: 0.7em;
  line-height: 1.65;
  color: #d4d0c8;
  overflow-x: auto;
  white-space: pre;
}

/* ── BUTTONS ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  border-radius: 8px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.85em;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-secondary { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-ghost {
  background: transparent;
  color: var(--accent);
  border: 1.5px solid var(--accent-border);
  padding: 8px 16px;
  font-size: 0.8em;
}
.btn-ghost:hover { background: var(--accent-bg); }
.btn-row { display: flex; gap: 10px; margin: 16px 0; flex-wrap: wrap; }

/* ── PRACTICE QUESTIONS ── */
.practice-q {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin: 18px 0;
}
.pq-label {
  font-family: var(--font-mono);
  font-size: 0.65em;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 10px;
}
.pq-text {
  font-family: var(--font-display);
  font-size: 1.1em;
  line-height: 1.6;
  margin-bottom: 16px;
  color: var(--ink);
}
.pq-options { display: flex; flex-direction: column; gap: 8px; }
.pq-opt {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 0.92em;
  line-height: 1.55;
  background: var(--surface);
}
.pq-opt:hover { border-color: var(--accent); background: var(--accent-bg); }
.pq-opt .letter {
  flex-shrink: 0;
  width: 26px; height: 26px;
  border-radius: 6px;
  background: var(--surface-alt);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.75em;
  font-weight: 600;
  color: var(--text-dim);
}
.pq-opt.correct { border-color: var(--green); background: var(--green-bg); }
.pq-opt.correct .letter { background: var(--green); color: white; }
.pq-opt.wrong { border-color: var(--red); background: var(--red-bg); }
.pq-opt.wrong .letter { background: var(--red); color: white; }
.pq-opt.disabled { pointer-events: none; opacity: 0.5; }
.pq-opt.disabled.correct, .pq-opt.disabled.wrong { opacity: 1; }
.pq-opt.show-answer { border-color: var(--green); background: var(--green-bg); opacity: 1; }
.pq-opt.show-answer .letter { background: var(--green); color: white; }

.feedback-panel {
  margin-top: 14px;
  padding: 18px;
  border-radius: 8px;
  font-size: 0.9em;
  line-height: 1.6;
  animation: slideUp 0.3s ease;
}
.feedback-panel.correct-fb { background: var(--green-bg); border: 1px solid var(--green-border); }
.feedback-panel.wrong-fb { background: var(--red-bg); border: 1px solid var(--red-border); }
.fb-title {
  font-family: var(--font-mono);
  font-size: 0.7em;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.fb-title.correct-t { color: var(--green); }
.fb-title.wrong-t { color: var(--red); }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.fade-in { animation: fadeIn 0.4s ease; }

/* ── TABLE ── */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0;
  font-size: 0.88em;
}
.data-table th {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  padding: 10px 14px;
  text-align: left;
  font-weight: 600;
  font-size: 0.85em;
  color: var(--ink);
}
.data-table td {
  border: 1px solid var(--border);
  padding: 10px 14px;
  background: var(--surface);
}

/* ── TOGGLES ── */
.toggle-panel { margin: 12px 0; }
.toggle-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  font-family: var(--font-body);
  font-size: 0.85em;
  font-weight: 600;
  color: var(--text-mid);
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
}
.toggle-btn:hover { border-color: var(--accent); color: var(--accent); }
.toggle-btn .icon { transition: transform 0.2s; }
.toggle-btn.open .icon { transform: rotate(90deg); }
.toggle-content {
  display: none;
  padding: 16px 18px;
  margin-top: -1px;
  border: 1.5px solid var(--border);
  border-top: none;
  border-radius: 0 0 8px 8px;
  background: var(--surface);
  font-size: 0.9em;
  line-height: 1.65;
  animation: slideUp 0.25s ease;
}
.toggle-content.show { display: block; }

/* ── EQUATION BUILDER ── */
.eq-builder {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 1.1em;
  flex-wrap: wrap;
  justify-content: center;
  margin: 14px 0;
  padding: 20px;
  background: var(--surface-alt);
  border-radius: 8px;
}
.eq-part { color: var(--ink); }
.eq-dynamic { color: var(--accent); font-weight: 600; min-width: 50px; text-align: center; }

/* ── RESPONSIVE ── */
@media(max-width:640px) {
  .hero h1 { font-size: 2em; }
  .card, .teach-panel { padding: 20px; }
  .dashboard-grid { grid-template-columns: repeat(2,1fr); }
  .module-dot { width: 28px; height: 28px; font-size: 0.6em; }
}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// REGRESSION LEARNING LAB — Full Interactive Teaching Application
// ═══════════════════════════════════════════════════════════════

const MODULES = [
  { id:0, title:"Welcome", short:"Start" },
  { id:1, title:"What Is Regression?", short:"Intro" },
  { id:2, title:"The Regression Equation", short:"Equation" },
  { id:3, title:"OLS: Finding the Best Line", short:"OLS" },
  { id:4, title:"Interpreting Coefficients", short:"Interpret" },
  { id:5, title:"Standard Errors & Sampling", short:"Std Err" },
  { id:6, title:"Hypothesis Testing", short:"Testing" },
  { id:7, title:"Confidence Intervals", short:"CI" },
  { id:8, title:"Substantive Significance", short:"Effect" },
  { id:9, title:"Reading Stata Output", short:"Stata" },
  { id:10, title:"Final Review Lab", short:"Review" },
];

let state = {
  currentModule: 0,
  completed: new Set(),
  practiceAnswers: {},
  sliders: { intercept: 30, slope: 5 },
  seSliders: { sigma: 10, varX: 50, n: 100 },
};

function go(mod) {
  state.currentModule = mod;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function completeAndNext() {
  state.completed.add(state.currentModule);
  if (state.currentModule < MODULES.length - 1) {
    go(state.currentModule + 1);
  }
}

function answerPractice(qId, selected, correct) {
  state.practiceAnswers[qId] = { selected, correct: selected === correct, answer: correct };
  render();
}

function togglePanel(id) {
  const el = document.getElementById(id);
  const btn = document.getElementById(id + '-btn');
  if (el) {
    el.classList.toggle('show');
    if (btn) btn.classList.toggle('open');
  }
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════

function render() {
  const app = document.getElementById('app');
  const m = state.currentModule;
  const progress = Math.round((state.completed.size / (MODULES.length - 1)) * 100);

  let navHTML = '';
  if (m > 0) {
    navHTML = `
      <div class="top-nav">
        <div class="nav-inner">
          <div class="nav-title">Regression Learning Lab</div>
          <div class="nav-progress">
            <span class="nav-progress-text">${state.completed.size}/${MODULES.length - 1} modules</span>
            <div class="nav-bar"><div class="nav-bar-fill" style="width:${progress}%"></div></div>
          </div>
        </div>
      </div>
      <div class="module-nav">
        ${MODULES.slice(1).map(mod => {
          let cls = 'module-dot';
          if (mod.id === m) cls += ' active';
          else if (state.completed.has(mod.id)) cls += ' completed';
          return `<div class="${cls}" onclick="go(${mod.id})" title="${mod.title}">${mod.id}</div>`;
        }).join('')}
      </div>
    `;
  }

  const content = renderModule(m);
  app.innerHTML = navHTML + `<div class="fade-in">${content}</div>`;

  // Post-render: draw canvases, attach slider listeners
  requestAnimationFrame(() => {
    setupInteractives();
  });
}

function renderModule(m) {
  switch(m) {
    case 0: return renderWelcome();
    case 1: return renderMod1();
    case 2: return renderMod2();
    case 3: return renderMod3();
    case 4: return renderMod4();
    case 5: return renderMod5();
    case 6: return renderMod6();
    case 7: return renderMod7();
    case 8: return renderMod8();
    case 9: return renderMod9();
    case 10: return renderMod10();
    default: return '';
  }
}

// ═══════════════════════════════════════
// MODULE 0: WELCOME
// ═══════════════════════════════════════

function renderWelcome() {
  return `
    <div class="hero">
      <div class="hero-label">Interactive Learning Lab</div>
      <h1>Bivariate Regression</h1>
      <p>An interactive guided tour through Gordon Ch. 5 — learn every concept through explanation, visual exploration, and guided practice.</p>
      <div style="display:flex; flex-direction:column; gap:8px; max-width:500px; margin:0 auto 30px; text-align:left;">
        ${MODULES.slice(1).map(mod => `
          <div style="display:flex; align-items:center; gap:12px; padding:10px 14px; border:1px solid var(--border); border-radius:8px; background:var(--surface);">
            <div style="width:28px; height:28px; border-radius:7px; background:var(--accent-bg); border:1px solid var(--accent-border); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:0.7em; font-weight:600; color:var(--accent); flex-shrink:0;">${mod.id}</div>
            <div style="font-weight:600; font-size:0.9em;">${mod.title}</div>
          </div>
        `).join('')}
      </div>
      <button class="btn btn-primary" onclick="go(1)" style="font-size:1em; padding:14px 36px;">
        Begin Learning →
      </button>
    </div>
  `;
}

// ═══════════════════════════════════════
// MODULE 1: WHAT IS REGRESSION?
// ═══════════════════════════════════════

function renderMod1() {
  return `
    <div class="mod-sub">Module 1 of 10</div>
    <div class="mod-header">What Is Regression?</div>

    <div class="teach-panel">
      <h3>The Core Idea</h3>
      <p>Regression analysis answers a simple question: <strong>On average, how does one variable (Y) change when another variable (X) changes?</strong></p>
      <p>Think of it as finding the <em>best straight line</em> through a cloud of data points. The line summarizes the average trend — not every individual, but the pattern overall.</p>
    </div>

    <div class="concept-box">
      <div class="cb-label">Key Concept</div>
      <p><strong>Every regression model has two parts:</strong></p>
      <p>1. <strong>Systematic component</strong> (β₀ + β₁X) — the regression line itself. It captures the <em>conditional mean</em> of Y at each level of X. This is the predictable, average relationship.</p>
      <p>2. <strong>Stochastic component</strong> (ε) — the error term. It captures everything else: omitted variables, measurement imprecision, and inherent randomness in human behavior.</p>
    </div>

    <div class="formula">
      Y<sub>i</sub> = β₀ + β₁X<sub>i</sub> + ε<sub>i</sub>
      <br><small style="color:var(--text-dim);">Population regression model (Equation 5.2 in Gordon)</small>
    </div>

    <div class="teach-panel">
      <h3>Why Two Components?</h3>
      <p>In social science, behavior is variable. Even women with the <em>same</em> number of children don't all do the same hours of chores. The regression line captures the average, and the error term allows for individual variation around that average.</p>
      <p>This is what makes regression <strong>probabilistic</strong>, not deterministic. We're modeling averages and allowing for individual variation.</p>
    </div>

    ${renderToggle('example1', '📖 Show Me a Concrete Example', `
      <p>Imagine predicting <strong>hours of chores per week</strong> (Y) from <strong>number of children</strong> (X) for employed women.</p>
      <p>The regression line might be: E(chores | kids) = 24 + 6 × kids</p>
      <p>This means:</p>
      <table class="data-table">
        <tr><th>Children (X)</th><th>Expected Chores (Ŷ)</th></tr>
        <tr><td>0</td><td>24 hours</td></tr>
        <tr><td>1</td><td>30 hours</td></tr>
        <tr><td>2</td><td>36 hours</td></tr>
        <tr><td>3</td><td>42 hours</td></tr>
      </table>
      <p>But a specific woman with 2 children might do 28 hours or 45 hours. Her deviation from 36 is her individual error term.</p>
    `)}

    ${renderToggle('mistake1', '⚠️ Common Student Mistake', `
      <p><strong>Mistake:</strong> Thinking the error term means "measurement error" or "mistakes in the data."</p>
      <p><strong>Correction:</strong> The error term represents ALL sources of variation in Y beyond X — omitted variables, inherent behavioral randomness, and yes, possibly some measurement error. It's not a mistake; it's the natural variability of human outcomes.</p>
    `)}

    ${renderPractice('m1q1',
      'In the model Y = β₀ + β₁X + ε, which part is the "systematic component"?',
      ['ε (the error term)', 'β₀ + β₁X (the regression line)', 'Y (the outcome)', 'β₁ (the slope alone)'],
      1,
      'The systematic component is β₀ + β₁X — the conditional mean of Y given X. It represents the predictable, average relationship. The error term (ε) is the stochastic component — the unpredictable part.'
    )}

    <div class="btn-row" style="justify-content:flex-end;">
      <button class="btn btn-primary" onclick="completeAndNext()">Continue to Module 2 →</button>
    </div>
  `;
}

// MODULE 3: OLS
// ═══════════════════════════════════════

function renderMod3() {
  return `
    <div class="mod-sub">Module 3 of 10</div>
    <div class="mod-header">OLS: Finding the Best Line</div>

    <div class="teach-panel">
      <h3>How Does OLS Choose the Line?</h3>
      <p>Given a cloud of data points, there are infinitely many lines you could draw. OLS chooses the specific line that <strong>minimizes the sum of squared residuals</strong>:</p>
      <div class="formula">Minimize Σ(Yᵢ − Ŷᵢ)² = Σêᵢ²</div>
      <p>A <strong>residual</strong> (ê) is the vertical distance from a data point to the line: the difference between what we observe (Y) and what the line predicts (Ŷ). OLS squares each residual, sums them all up, and finds the intercept and slope that make this sum as small as possible.</p>
    </div>

    <div class="concept-box">
      <div class="cb-label">Why Square the Errors?</div>
      <p><strong>Three reasons:</strong></p>
      <p>1. <strong>Raw errors cancel out.</strong> For ANY OLS line, the positive and negative residuals sum to exactly zero (Σêᵢ = 0). So minimizing the raw sum doesn't work — it's always zero.</p>
      <p>2. <strong>Squaring penalizes large errors more.</strong> An error of 10 contributes 100 to the sum; an error of 2 contributes only 4. This means OLS avoids egregiously bad predictions.</p>
      <p>3. <strong>The math works out cleanly.</strong> Squaring produces a smooth, differentiable function with a unique minimum, giving us elegant closed-form solutions.</p>
    </div>

    <div class="teach-panel">
      <h3>The OLS Formulas</h3>
      <p>The calculus yields two formulas:</p>
      <div class="formula">
        β̂₁ = Σ(Xᵢ − X̄)(Yᵢ − Ȳ) / Σ(Xᵢ − X̄)²
        <br><small style="color:var(--text-dim);">Slope = Covariance(X,Y) / Variance(X)  —  Equation 5.5</small>
      </div>
      <div class="formula">
        β̂₀ = Ȳ − β̂₁X̄
        <br><small style="color:var(--text-dim);">Intercept  —  Equation 5.6</small>
      </div>
      <p>The slope formula has a beautiful intuition: the <strong>numerator</strong> measures how X and Y move together (covariance), and the <strong>denominator</strong> measures how much X spreads out (variance). The slope is literally "shared movement divided by X's spread."</p>
    </div>

    ${renderToggle('ols-deep', '🔬 Deeper: What the Slope Formula Tells Us', `
      <p>Because the slope = Cov(X,Y) / Var(X):</p>
      <p>• If X and Y are unrelated (Cov = 0), the slope is zero — a flat line.</p>
      <p>• If high X goes with high Y (positive Cov), the slope is positive.</p>
      <p>• If high X goes with low Y (negative Cov), the slope is negative.</p>
      <p>• The slope's magnitude depends on how strong the co-movement is <em>relative to X's spread</em>.</p>
      <p>This is also why <strong>regression is asymmetric</strong>: swapping Y and X changes the denominator from Var(X) to Var(Y), giving a different slope.</p>
    `)}

    ${renderPractice('m3q1',
      'OLS guarantees that the sum of the residuals (Σêᵢ) equals:',
      ['The sum of squared errors', 'The slope', 'Zero', 'The sample size'],
      2,
      'One mathematical consequence of OLS is that Σêᵢ = 0: the positive residuals (above the line) exactly cancel the negative residuals (below the line). This is NOT an assumption — it is a mathematical property of the OLS solution. This is why we use squared errors to assess fit, since the raw sum is always zero.'
    )}

    <div class="btn-row" style="justify-content:space-between;">
      <button class="btn btn-secondary" onclick="go(2)">← Back</button>
      <button class="btn btn-primary" onclick="completeAndNext()">Continue to Module 4 →</button>
    </div>
  `;
}

function renderMod5() {
  return `
    <div class="mod-sub">Module 5 of 10</div>
    <div class="mod-header">Standard Errors & Sampling</div>

    <div class="teach-panel">
      <h3>Your Estimate Is One of Many Possible Estimates</h3>
      <p>Every time you draw a sample, you get slightly different estimates of β₀ and β₁. The <strong>sampling distribution</strong> is the distribution of all possible estimates across all possible samples from the same population.</p>
      <p>The <strong>standard error</strong> of the slope is the standard deviation of this sampling distribution — it measures how much your slope estimate "bounces around" across samples.</p>
    </div>

    <div class="formula">
      σ̂<sub>β̂₁</sub> = σ̂ / √Σ(Xᵢ − X̄)²
      <br><small style="color:var(--text-dim);">Standard error of the slope — from Equation 5.8</small>
    </div>

    <div class="teach-panel">
      <h3>Three Factors That Control Precision</h3>
      <p>This formula tells a clear story about what makes an estimate more or less precise:</p>
      <table class="data-table">
        <tr><th>Factor</th><th>Location</th><th>Effect on SE</th><th>Intuition</th></tr>
        <tr><td><strong>Conditional SD (σ̂)</strong></td><td>Numerator</td><td>↑ scatter → ↑ SE</td><td>More noise around the line → harder to pin down the slope</td></tr>
        <tr><td><strong>Variation in X</strong></td><td>Denominator</td><td>↑ spread → ↓ SE</td><td>More spread in X → you can "see" more of the line</td></tr>
        <tr><td><strong>Sample size (n)</strong></td><td>Denominator*</td><td>↑ n → ↓ SE</td><td>More data → more stable estimates</td></tr>
      </table>
      <p style="font-size:0.82em; color:var(--text-dim);">*n doesn't appear explicitly, but more observations add more terms to Σ(Xᵢ − X̄)², increasing the denominator.</p>
    </div>

    <div class="interactive-zone">
      <div class="iz-label">🔬 Interactive: SE Explorer</div>
      <p style="font-size:0.88em; color:var(--text-mid); margin-bottom:12px;">Adjust each factor and watch how the standard error changes.</p>

      <div class="slider-group">
        <div class="slider-label">
          <span class="sl-name">Conditional SD (σ̂) — scatter around line</span>
          <span class="sl-val" id="se-sigma-val">${state.seSliders.sigma}</span>
        </div>
        <input type="range" id="se-sigma" min="1" max="30" value="${state.seSliders.sigma}" step="1">
      </div>
      <div class="slider-group">
        <div class="slider-label">
          <span class="sl-name">Variation in X — Σ(X−X̄)²</span>
          <span class="sl-val" id="se-varx-val">${state.seSliders.varX}</span>
        </div>
        <input type="range" id="se-varx" min="5" max="200" value="${state.seSliders.varX}" step="5">
      </div>
      <div class="slider-group">
        <div class="slider-label">
          <span class="sl-name">Sample size (n) — observations</span>
          <span class="sl-val" id="se-n-val">${state.seSliders.n}</span>
        </div>
        <input type="range" id="se-n" min="10" max="500" value="${state.seSliders.n}" step="10">
      </div>

      <div class="formula" id="se-result" style="font-size:1.1em;">
        SE = ${(state.seSliders.sigma / Math.sqrt(state.seSliders.varX)).toFixed(3)}
      </div>
      <p style="font-size:0.82em; color:var(--text-dim); text-align:center;">Smaller SE = more precise estimate = easier to detect significant effects</p>
    </div>

    <div class="insight-box">
      <div class="ib-label">Professor Insight</div>
      <p>This formula is the foundation for understanding <strong>multicollinearity</strong> in Chapter 11. In multiple regression, an additional factor enters the denominator: (1 − r²₁₂). When predictors are correlated, this factor shrinks the denominator, inflating the SE. The bivariate SE formula you learn now is the base case you must understand first.</p>
    </div>

    ${renderPractice('m5q1',
      'A researcher restricts her sample to only middle-income families (X has small range). How does this affect the SE of the slope?',
      [
        'SE decreases because the sample is more homogeneous',
        'SE increases because variation in X is reduced, making the denominator smaller',
        'No effect — only sample size matters',
        'SE stays the same but the slope changes'
      ],
      1,
      'Restricting the range of X reduces Σ(Xᵢ − X̄)², which makes the denominator of the SE formula smaller. A smaller denominator means a LARGER standard error — less precise estimates. This is why researchers who want precise estimates should sample across the full range of their predictor variable.'
    )}

    <div class="btn-row" style="justify-content:space-between;">
      <button class="btn btn-secondary" onclick="go(4)">← Back</button>
      <button class="btn btn-primary" onclick="completeAndNext()">Continue to Module 6 →</button>

function renderMod6() {
  return `
    <div class="mod-sub">Module 6 of 10</div>
    <div class="mod-header">Hypothesis Testing</div>

    <div class="teach-panel">
      <h3>The Central Question</h3>
      <p>Hypothesis testing asks: <strong>"Could the association I found in my sample be due to chance alone?"</strong></p>
      <p>We set up a "straw man" — the null hypothesis that there is NO linear relationship (β₁ = 0) — and then ask whether our data are consistent with that straw man.</p>
    </div>

    <div class="concept-box">
      <div class="cb-label">The Mechanics</div>
      <p><strong>Step 1:</strong> State hypotheses → H₀: β₁ = 0 vs. Hₐ: β₁ ≠ 0</p>
      <p><strong>Step 2:</strong> Calculate the t-statistic → t = β̂₁ / σ̂<sub>β̂₁</sub></p>
      <p><strong>Step 3:</strong> Compare to critical value or check p-value</p>
      <p><strong>Step 4:</strong> If |t| > 1.96 (or p < 0.05): Reject H₀. Evidence of a linear association.</p>
    </div>

    <div class="formula">
      t = (β̂₁ − 0) / σ̂<sub>β̂₁</sub> = β̂₁ / σ̂<sub>β̂₁</sub>
      <br><small style="color:var(--text-dim);">"How many standard errors is the slope from zero?"</small>
    </div>

    <div class="teach-panel">
      <h3>The t-Statistic as a Signal-to-Noise Ratio</h3>
      <p>Think of it this way: the <strong>numerator</strong> (β̂₁) is the <em>signal</em> — how far your estimate is from "no effect." The <strong>denominator</strong> (σ̂<sub>β̂₁</sub>) is the <em>noise</em> — how uncertain you are about the estimate.</p>
      <p>A large t means the signal overwhelms the noise. A small t means the noise drowns out the signal.</p>
    </div>

    <div class="teach-panel">
      <h3>Two-Sided vs. One-Sided Tests</h3>
      <p><strong>Two-sided</strong> (Hₐ: β₁ ≠ 0): You just think there's <em>some</em> relationship, but you don't predict the direction. Stata's default <code>P>|t|</code> is the two-sided p-value.</p>
      <p><strong>One-sided</strong> (Hₐ: β₁ > 0 or β₁ < 0): You predict the direction in advance. You must convert Stata's p-value:</p>
      <table class="data-table">
        <tr><th>Coefficient sign matches Hₐ?</th><th>One-sided p-value</th></tr>
        <tr><td>✓ Yes (correct direction)</td><td>Divide Stata's p by 2</td></tr>
        <tr><td>✗ No (wrong direction)</td><td>1 − (Stata's p / 2)</td></tr>
      </table>
    </div>

    <div class="mistake-box">
      <div class="mb-label">Common Student Mistake</div>
      <p><strong>"We accept the null hypothesis."</strong> ← NEVER say this. The correct phrasing is "we fail to reject H₀" or "we do not find sufficient evidence to reject H₀." Failing to reject is NOT the same as proving the null is true — the real slope might be small but nonzero, and you simply lack the power to detect it.</p>
    </div>

    ${renderPractice('m6q1',
      'Stata reports: coefficient = 0.0011333, SE = 0.0002185, t = 5.19, P>|t| = 0.000. At α = 0.05, what is the conclusion for a two-sided test?',
      [
        'Fail to reject H₀ — the coefficient is very small',
        'Reject H₀ — there is statistically significant evidence of a linear association between earnings and distance',
        'Accept H₀ — the intercept is larger than the slope',
        'Cannot determine without the R²'
      ],
      1,
      'The p-value (0.000) < α (0.05), so we reject H₀: β₁ = 0. Alternatively, |t| = 5.19 > 1.96 (the critical value). We conclude there IS statistically significant evidence of a linear association between earnings and distance. The smallness of the coefficient is a question of substantive, not statistical, significance.'
    )}

    <div class="btn-row" style="justify-content:space-between;">
      <button class="btn btn-secondary" onclick="go(5)">← Back</button>
      <button class="btn btn-primary" onclick="completeAndNext()">Continue to Module 7 →</button>
    </div>
  `;
}

// ═══════════════════════════════════════

function renderMod7() {
  return `
    <div class="mod-sub">Module 7 of 10</div>
    <div class="mod-header">Confidence Intervals</div>

    <div class="teach-panel">
      <h3>A Range of Plausible Values</h3>
      <p>A 95% confidence interval gives you a range of values that are <em>plausible</em> for the true population slope. It's constructed by taking your point estimate and adding/subtracting a margin of error:</p>
      <div class="formula">
        95% CI = β̂₁ ± 1.96 × σ̂<sub>β̂₁</sub>

function renderMod8() {
  return `
    <div class="mod-sub">Module 8 of 10</div>
    <div class="mod-header">Substantive Significance</div>

    <div class="teach-panel">
      <h3>Statistical ≠ Substantive Significance</h3>
      <p>A coefficient can be <strong>statistically significant</strong> (unlikely to be zero) but <strong>substantively trivial</strong> (too small to matter in the real world). These are two separate questions.</p>
      <p>With large samples (n = 50,000+), even tiny effects become statistically significant because the standard error shrinks. You must always ask: <em>"Is this effect big enough to matter?"</em></p>
    </div>

    <div class="concept-box">
      <div class="cb-label">Three Tools for Assessing Substantive Size</div>
      <p><strong>1. Rescaling (the iβ̂₁ rule):</strong> Multiply the coefficient by a meaningful constant. A slope of 0.00113 miles/dollar becomes 11.3 miles per $10,000 — much easier to evaluate.</p>
      <p><strong>2. Standardized coefficient:</strong> (σ̂_X / σ̂_Y) × β̂₁. Interpretation: "For each one-SD increase in X, Y changes by [coefficient] SDs." In bivariate regression, this equals the Pearson r.</p>
      <p><strong>3. Cohen's benchmarks:</strong> For standardized coefficients: ~0.10 small, ~0.30 medium, ~0.50 large. Use as rough guides alongside real-world context.</p>
    </div>

    <div class="interactive-zone">
      <div class="iz-label">🔬 Interactive: Rescaling in Action</div>
      <p style="font-size:0.88em; color:var(--text-mid);">Original: β̂₁ = 0.0011333 miles per dollar of earnings</p>
      <table class="data-table">
        <tr><th>Rescale X to...</th><th>Multiply by</th><th>New β̂₁</th><th>Interpretation</th></tr>
        <tr><td>$1,000</td><td>1,000</td><td>1.13 miles</td><td>~1 mile per $1K</td></tr>
        <tr><td>$10,000</td><td>10,000</td><td>11.33 miles</td><td>~11 miles per $10K</td></tr>
        <tr><td>$50,000</td><td>50,000</td><td>56.67 miles</td><td>~57 miles per $50K</td></tr>
      </table>
      <p style="font-size:0.85em; margin-top:10px;"><strong>Critical:</strong> The t-value stays at 5.19 for ALL of these. Rescaling changes the coefficient and SE by the same factor, leaving the ratio unchanged. Statistical significance is invariant to units of measurement.</p>
    </div>

    <div class="insight-box">
      <div class="ib-label">Professor Insight</div>
      <p>Gordon's NSFH distance example produces r = 0.065 (standardized slope). By Cohen's standards, this is well below "small" (0.20). Even rescaled to $10,000 units, 11 miles of distance per $10,000 is arguably modest. So we have a paradox: highly significant (p < 0.001) but substantively small. A strong student discusses BOTH dimensions. A weak student stops at "p < 0.05."</p>
    </div>

    ${renderPractice('m8q1',

      2,
      'The t-value stays EXACTLY the same: 5.19. Both the coefficient and SE get multiplied by 10,000, so their ratio is unchanged. This is a deep result: the statistical significance of an association is invariant to the units you choose. Gordon proves this explicitly in Box 5.6.'
    )}

function setupInteractives() {
  // Module 2: Regression line canvas
  const b0Slider = document.getElementById('b0-slider');
  const b1Slider = document.getElementById('b1-slider');
  if (b0Slider && b1Slider) {
    const update = () => {
      const b0 = parseFloat(b0Slider.value);
      const b1 = parseFloat(b1Slider.value);
      state.sliders.intercept = b0;
      state.sliders.slope = b1;
      document.getElementById('b0-val').textContent = b0;
      document.getElementById('b1-val').textContent = b1;
      document.getElementById('eq-b0').textContent = b0;
      document.getElementById('eq-b1').textContent = b1;
      for (let x = 0; x <= 4; x++) {
        const el = document.getElementById('pred' + x);
        if (el) el.textContent = (b0 + b1 * x).toFixed(1);
      }
      drawRegLine(b0, b1);
    };
    b0Slider.addEventListener('input', update);
    b1Slider.addEventListener('input', update);
    drawRegLine(state.sliders.intercept, state.sliders.slope);
  }

  // Module 5: SE explorer
  const seSigma = document.getElementById('se-sigma');
  const seVarx = document.getElementById('se-varx');
  const seN = document.getElementById('se-n');
  if (seSigma) {
    const updateSE = () => {
      const sigma = parseFloat(seSigma.value);
      const varx = parseFloat(seVarx.value);
      const n = parseFloat(seN.value);
      state.seSliders = { sigma, varX: varx, n };
      document.getElementById('se-sigma-val').textContent = sigma;
      document.getElementById('se-varx-val').textContent = varx;
      document.getElementById('se-n-val').textContent = n;
      // SE = sigma / sqrt(varX * n/10) — simplified for demonstration
      const effectiveVarX = varx * (n / 50);
      const se = sigma / Math.sqrt(effectiveVarX);
      document.getElementById('se-result').innerHTML =
        `SE = ${sigma} / √${effectiveVarX.toFixed(0)} = <strong>${se.toFixed(3)}</strong>` +
        `<br><small style="color:var(--text-dim);">` +
        (se < 0.5 ? 'Very precise — easy to detect effects' :
         se < 2 ? 'Moderately precise' : 'Low precision — hard to detect small effects') +
        `</small>`;
    };
    seSigma.addEventListener('input', updateSE);
    seVarx.addEventListener('input', updateSE);
    seN.addEventListener('input', updateSE);
    updateSE();
  }
}

function drawRegLine(b0, b1) {
  const canvas = document.getElementById('regCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width = canvas.offsetWidth * 2;
  const H = canvas.height = canvas.offsetHeight * 2;
  ctx.scale(2, 2);
  const w = W / 2;
  const h = H / 2;

  ctx.clearRect(0, 0, w, h);

  const pad = { l: 50, r: 20, t: 20, b: 35 };
  const plotW = w - pad.l - pad.r;
  const plotH = h - pad.t - pad.b;

  const xMin = 0, xMax = 5;
  const yMin = 0, yMax = Math.max(80, b0 + b1 * 5 + 10);
  const yMaxAdj = Math.max(yMax, b0 + 10);

  function toX(v) { return pad.l + (v - xMin) / (xMax - xMin) * plotW; }
  function toY(v) { return pad.t + plotH - (v - yMin) / (yMaxAdj - yMin) * plotH; }

  // Grid
  ctx.strokeStyle = '#e8e4dc';
  ctx.lineWidth = 0.5;
  for (let y = 0; y <= yMaxAdj; y += 10) {
    ctx.beginPath();
    ctx.moveTo(pad.l, toY(y));
    ctx.lineTo(w - pad.r, toY(y));
    ctx.stroke();
  }
  for (let x = 0; x <= xMax; x++) {
    ctx.beginPath();
    ctx.moveTo(toX(x), pad.t);
    ctx.lineTo(toX(x), pad.t + plotH);
    ctx.stroke();
  }

  // Axes
  ctx.strokeStyle = '#8a857b';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad.l, pad.t + plotH);
  ctx.lineTo(w - pad.r, pad.t + plotH);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(pad.l, pad.t);
  ctx.lineTo(pad.l, pad.t + plotH);
  ctx.stroke();

  // Labels
  ctx.fillStyle = '#8a857b';
  ctx.font = '10px Outfit, sans-serif';
  ctx.textAlign = 'center';
  for (let x = 0; x <= xMax; x++) {
    ctx.fillText(x, toX(x), pad.t + plotH + 14);
  }
  ctx.textAlign = 'right';
  for (let y = 0; y <= yMaxAdj; y += 20) {
    ctx.fillText(y, pad.l - 6, toY(y) + 4);
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = '#5a564e';
  ctx.font = '11px Outfit, sans-serif';
  ctx.fillText('X (Number of Children)', w / 2, h - 4);
  ctx.save();
  ctx.translate(12, h / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('Ŷ (Predicted Hours)', 0, 0);
  ctx.restore();

  // Simulated data points
  const seed = 42;
  let rng = seed;
  function rand() { rng = (rng * 16807 + 0) % 2147483647; return rng / 2147483647; }
  ctx.fillStyle = 'rgba(180,76,42,0.25)';
  for (let i = 0; i < 60; i++) {
    const x = rand() * 4.5;
    const yTrue = b0 + b1 * x;
    const noise = (rand() - 0.5) * 24;
    const y = yTrue + noise;
    if (y >= yMin && y <= yMaxAdj) {
      ctx.beginPath();
      ctx.arc(toX(x), toY(y), 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Regression line
  ctx.strokeStyle = '#b44c2a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  const y0 = b0 + b1 * xMin;
  const y5 = b0 + b1 * xMax;
  ctx.moveTo(toX(xMin), toY(Math.max(yMin, Math.min(yMaxAdj, y0))));
  ctx.lineTo(toX(xMax), toY(Math.max(yMin, Math.min(yMaxAdj, y5))));
  ctx.stroke();

  // Intercept dot
  if (y0 >= yMin && y0 <= yMaxAdj) {
    ctx.fillStyle = '#b44c2a';
    ctx.beginPath();
    ctx.arc(toX(0), toY(y0), 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5a564e';
    ctx.font = 'bold 10px JetBrains Mono, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`β₀ = ${b0}`, toX(0) + 8, toY(y0) - 6);
  }
}

// Module 4: Interpretation checker
function checkInterp(idx) {
  const opts = document.querySelectorAll('#interp-opts .pq-opt');
  opts.forEach((o, i) => {
    o.style.pointerEvents = 'none';
    if (i === 1) o.classList.add('show-answer');
    else if (i === idx && i !== 1) o.classList.add('wrong');
    else o.classList.add('disabled');
  });
  const fb = document.getElementById('interp-feedback');
  if (idx === 1) {
    fb.innerHTML = `<div class="feedback-panel correct-fb"><div class="fb-title correct-t">✓ Perfect!</div>This interpretation has all four required elements: direction ("farther"), magnitude ("0.00113 miles"), both variables ("dollar in annual earnings" → "distance from mother"), and probabilistic language ("is expected to," "on average").</div>`;
  } else {
    const reasons = [
      'Option A uses causal language ("cause") which is inappropriate for observational data, and it lacks probabilistic phrasing.',
      '',
      'Option C doesn\'t specify the predictor clearly ("for each person who earns more" is vague) and lacks "on average."',
      'Option D confuses the regression coefficient with a probability — 0.00113 is a rate of change, not a percentage.'
    ];
    fb.innerHTML = `<div class="feedback-panel wrong-fb"><div class="fb-title wrong-t">✗ Not quite</div>${reasons[idx]} The correct answer is B: "For each additional dollar in annual earnings, the adult is expected to live 0.00113 miles farther from their mother, on average."</div>`;
  }
}
