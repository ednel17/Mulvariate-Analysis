<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ch 7: Dummy Variables Learning Lab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600;8..60,700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
:root{--bg:#0f1117;--surface:#181b24;--surface2:#1e2230;--surface3:#252a3a;--border:#2a2f42;--text:#e2e4ea;--text-dim:#8b90a0;--text-bright:#fff;--accent:#6c9cfc;--accent2:#4ecdc4;--accent3:#ff6b9d;--success:#4ecdc4;--warn:#ffd166;--error:#ff6b6b;--code-bg:#141720;--radius:12px;--radius-sm:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;transition:transform .3s}
.sidebar-header{padding:24px 20px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-family:'Source Serif 4',serif;font-size:18px;font-weight:700;color:var(--accent);line-height:1.3}
.sidebar-header p{font-size:11px;color:var(--text-dim);margin-top:4px;text-transform:uppercase;letter-spacing:1.5px}
.progress-bar-container{padding:12px 20px;border-bottom:1px solid var(--border)}
.progress-label{font-size:11px;color:var(--text-dim);margin-bottom:6px;display:flex;justify-content:space-between}
.progress-track{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .5s;width:0%}
.nav-list{flex:1;overflow-y:auto;padding:12px 0}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 20px;cursor:pointer;transition:all .2s;font-size:13px;color:var(--text-dim)}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--surface2);color:var(--accent);border-right:2px solid var(--accent)}
.nav-item.completed .nav-dot{background:var(--success)}
.nav-dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0}
.nav-item.active .nav-dot{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.sidebar-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.sidebar-footer .stat{font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between}
.reset-btn{width:100%;padding:8px;background:var(--surface3);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);font-size:12px;cursor:pointer;font-family:'DM Sans';transition:all .2s}
.reset-btn:hover{border-color:var(--error);color:var(--error)}
.main{margin-left:280px;min-height:100vh}
.module-container{max-width:820px;margin:0 auto;padding:48px 40px 80px}
h2.module-title{font-family:'Source Serif 4',serif;font-size:32px;font-weight:700;color:var(--text-bright);margin-bottom:8px;line-height:1.3}
.module-subtitle{font-size:14px;color:var(--text-dim);margin-bottom:36px;padding-bottom:24px;border-bottom:1px solid var(--border)}
h3{font-family:'Source Serif 4',serif;font-size:22px;font-weight:600;color:var(--text-bright);margin:32px 0 12px}
h4{font-size:15px;font-weight:600;color:var(--accent);margin:24px 0 8px;text-transform:uppercase;letter-spacing:.5px}
p{margin-bottom:14px;font-size:15px}
.hl{color:var(--accent);font-weight:600}.hl2{color:var(--accent2);font-weight:600}.hl3{color:var(--accent3);font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin:20px 0}
.card-accent{border-left:3px solid var(--accent);background:var(--surface2)}
.card-success{border-left:3px solid var(--success)}
.card-warn{border-left:3px solid var(--warn)}
.card-error{border-left:3px solid var(--error)}
.card-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px;display:block}
.card-label.blue{color:var(--accent)}.card-label.green{color:var(--success)}.card-label.yellow{color:var(--warn)}.card-label.pink{color:var(--accent3)}
.formula-block{background:var(--code-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:20px 24px;font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--accent);margin:16px 0;text-align:center;line-height:2}
code,.code{font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--code-bg);padding:2px 7px;border-radius:4px;color:var(--accent2)}
.stata-block{background:var(--code-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 20px;margin:12px 0;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text);line-height:1.8;overflow-x:auto;white-space:pre}
.interactive-zone{background:linear-gradient(135deg,rgba(108,156,252,.06),rgba(78,205,196,.06));border:1px solid rgba(108,156,252,.2);border-radius:var(--radius);padding:28px;margin:24px 0}
.interactive-zone h4{margin-top:0}
.slider-group{margin:16px 0}
.slider-group label{display:flex;justify-content:space-between;font-size:13px;color:var(--text-dim);margin-bottom:6px}
.slider-group label span{color:var(--accent);font-weight:600;font-family:'JetBrains Mono',monospace}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;background:var(--surface3);border-radius:3px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:var(--accent);border-radius:50%;cursor:pointer;box-shadow:0 0 8px rgba(108,156,252,.4)}
.computed-result{background:var(--code-bg);border-radius:var(--radius-sm);padding:16px 20px;margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--text);border:1px solid var(--border)}
.computed-result .val{color:var(--accent);font-weight:600}.computed-result .val2{color:var(--accent2);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:'DM Sans'}
.btn-primary{background:var(--accent);color:#0f1117}.btn-primary:hover{background:#84aeff;transform:translateY(-1px)}
.btn-secondary{background:var(--surface3);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:var(--border)}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.q-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin:20px 0;position:relative}
.q-block h4{margin-top:0;color:var(--accent2)}
.q-num{position:absolute;top:16px;right:20px;font-size:11px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.option-btn{display:block;width:100%;text-align:left;padding:12px 16px;margin:8px 0;border-radius:var(--radius-sm);background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:14px;cursor:pointer;transition:all .2s;font-family:'DM Sans';line-height:1.5}
.option-btn:hover{border-color:var(--accent);background:var(--surface3)}
.option-btn.correct{border-color:var(--success);background:rgba(78,205,196,.1);color:var(--success)}
.option-btn.incorrect{border-color:var(--error);background:rgba(255,107,107,.1);color:var(--error)}
.option-btn.disabled{pointer-events:none;opacity:.6}
.option-btn.show-correct{border-color:var(--success);opacity:1!important}
.fb{margin-top:16px;padding:16px 20px;border-radius:var(--radius-sm);font-size:14px;display:none;line-height:1.6}
.fb.show{display:block}
.fb.correct-fb{background:rgba(78,205,196,.08);border:1px solid rgba(78,205,196,.3);color:var(--success)}
.fb.incorrect-fb{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.3);color:#ffa0a0}
.fb strong{display:block;margin-bottom:4px}
.retry-btn{margin-top:12px;padding:7px 14px;background:var(--surface3);border:1px solid var(--border);border-radius:6px;color:var(--text-dim);font-size:12px;cursor:pointer;font-family:'DM Sans'}
.retry-btn:hover{border-color:var(--accent);color:var(--accent)}
.text-input-group{margin:12px 0}
.text-input-group label{font-size:13px;color:var(--text-dim);display:block;margin-bottom:6px}
.text-input{width:100%;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:'DM Sans';outline:none;transition:border-color .2s}
.text-input:focus{border-color:var(--accent)}
.text-input.correct-input{border-color:var(--success);background:rgba(78,205,196,.05)}
.text-input.incorrect-input{border-color:var(--error);background:rgba(255,107,107,.05)}
textarea.text-input{min-height:80px;resize:vertical;line-height:1.6}
.check-btn{margin-top:8px;padding:10px 20px;background:var(--accent);color:#0f1117;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans'}
.check-btn:hover{background:#84aeff}
.select-input{padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:'DM Sans';cursor:pointer;outline:none;min-width:160px}
.select-input:focus{border-color:var(--accent)}
.expandable{margin:12px 0}
.expand-trigger{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;width:100%;color:var(--text-dim);font-size:13px;font-weight:500;transition:all .2s;font-family:'DM Sans'}
.expand-trigger:hover{color:var(--text);border-color:var(--accent)}
.expand-trigger .arrow{transition:transform .2s}
.expand-trigger.open .arrow{transform:rotate(90deg)}
.expand-content{display:none;padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);font-size:14px;line-height:1.7}
.expand-content.open{display:block}
.module-nav{display:flex;justify-content:space-between;margin-top:48px;padding-top:24px;border-top:1px solid var(--border)}
.data-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}
.data-table th{text-align:left;padding:10px 12px;background:var(--surface3);color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:.5px;font-size:11px;border-bottom:1px solid var(--border)}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.data-table .hl-cell{background:rgba(108,156,252,.1);color:var(--accent);font-weight:600}
.data-table .ref-cell{background:rgba(255,209,102,.1);color:var(--warn);font-weight:600}
canvas.chart{width:100%;max-height:280px;margin:12px 0;border-radius:var(--radius-sm)}
.ref-pill{display:inline-block;padding:5px 14px;border-radius:20px;font-size:13px;cursor:pointer;transition:all .2s;border:1px solid var(--border);background:var(--surface2);color:var(--text-dim);margin:4px}
.ref-pill:hover{border-color:var(--accent);color:var(--text)}
.ref-pill.active{border-color:var(--warn);background:rgba(255,209,102,.1);color:var(--warn);font-weight:600}
.mobile-header{display:none;position:fixed;top:0;left:0;right:0;height:56px;background:var(--surface);border-bottom:1px solid var(--border);z-index:200;padding:0 16px;align-items:center;justify-content:space-between}
.hamburger{background:none;border:none;color:var(--text);font-size:24px;cursor:pointer}
@media(max-width:768px){.mobile-header{display:flex}.sidebar{transform:translateX(-100%);z-index:300}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding-top:56px}.module-container{padding:24px 16px 80px}h2.module-title{font-size:26px}}
.fade-in{animation:fadeIn .4s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="mobile-header">
  <button class="hamburger" onclick="toggleSidebar()">☰</button>
  <span style="font-weight:600;font-size:14px;color:var(--accent)">Ch 7 Learning Lab</span>
  <span style="font-size:12px;color:var(--text-dim)" id="mobileProgress">0%</span>
</div>
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header"><h1>Dummy Variables<br>Learning Lab</h1><p>Gordon Ch. 7 · Interactive</p></div>
  <div class="progress-bar-container"><div class="progress-label"><span>Progress</span><span id="progressPct">0%</span></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>
  <div class="nav-list" id="navList"></div>
  <div class="sidebar-footer">
    <div class="stat"><span>Modules visited</span><span id="statsVisited">0/8</span></div>
    <div class="stat"><span>Questions answered</span><span id="statsAnswered">0</span></div>
    <button class="reset-btn" onclick="resetProgress()">↻ Reset All Progress</button>
  </div>
</nav>
<div class="main"><div class="module-container" id="moduleContainer"></div></div>

<script>
const STORAGE_KEY='ch7_dummy_lab_v1';
let currentModule=0;
const completed=new Set();
let totalAnswered=0;
let totalCorrect=0;

function saveProgress(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({currentModule,completed:[...completed],totalAnswered,totalCorrect,ts:Date.now()}))}catch(e){}}
function loadProgress(){try{const r=localStorage.getItem(STORAGE_KEY);if(!r)return false;const s=JSON.parse(r);currentModule=s.currentModule||0;(s.completed||[]).forEach(i=>completed.add(i));totalAnswered=s.totalAnswered||0;totalCorrect=s.totalCorrect||0;return true}catch(e){return false}}
function resetProgress(){var btn=document.querySelector('.reset-btn');if(!btn.dataset.armed){btn.dataset.armed='1';btn.textContent='⚠ Click again to confirm';btn.style.borderColor='var(--error)';btn.style.color='var(--error)';setTimeout(function(){delete btn.dataset.armed;btn.textContent='↻ Reset All Progress';btn.style.borderColor='';btn.style.color=''},3000);return}delete btn.dataset.armed;btn.textContent='↻ Reset All Progress';btn.style.borderColor='';btn.style.color='';try{localStorage.removeItem(STORAGE_KEY)}catch(e){}currentModule=0;completed.clear();totalAnswered=0;totalCorrect=0;qCounter=0;buildNav();renderModule();updateProgress();saveProgress()}

let qCounter=0;
function uid(){return 'q'+(++qCounter)}

function checkMCQ(id,chosen,correct){
  const btns=document.querySelectorAll('#'+id+'_opts .option-btn');
  const fb=document.getElementById(id+'_fb');
  const block=document.getElementById(id);
  btns.forEach((b,i)=>{b.classList.add('disabled');if(i===chosen)b.classList.add(chosen===correct?'correct':'incorrect');if(i===correct&&chosen!==correct)b.classList.add('show-correct')});
  if(chosen===correct)totalCorrect++;
  totalAnswered++;saveProgress();
  fb.className='fb show '+(chosen===correct?'correct-fb':'incorrect-fb');
  const feedbacks=JSON.parse(block.getAttribute('data-fb')||'["",""]');
  fb.innerHTML='<strong>'+(chosen===correct?'✓ Correct!':'✗ Not quite.')+'</strong>'+feedbacks[chosen===correct?0:1]+'<br><button class="retry-btn" onclick="retryMCQ(\''+id+'\')">↻ Try Again</button>';
}
function retryMCQ(id){document.querySelectorAll('#'+id+'_opts .option-btn').forEach(b=>{b.classList.remove('correct','incorrect','disabled','show-correct')});var f=document.getElementById(id+'_fb');f.className='fb';f.innerHTML=''}
function checkText(id){
  const block=document.getElementById(id),input=document.getElementById(id+'_input'),fb=document.getElementById(id+'_fb'),val=input.value.trim();
  if(!val){input.style.borderColor='var(--error)';return}
  const isCorrect=window[block.getAttribute('data-checker')](val);
  input.classList.add(isCorrect?'correct-input':'incorrect-input');input.setAttribute('readonly','true');
  if(isCorrect)totalCorrect++;totalAnswered++;saveProgress();
  fb.className='fb show '+(isCorrect?'correct-fb':'incorrect-fb');
  fb.innerHTML='<strong>'+(isCorrect?'✓ Correct!':'✗ Not quite.')+'</strong>'+decodeURIComponent(block.getAttribute(isCorrect?'data-cfb':'data-ifb'))+'<br><button class="retry-btn" onclick="retryText(\''+id+'\')">↻ Try Again</button>';
}
function retryText(id){var i=document.getElementById(id+'_input');i.classList.remove('correct-input','incorrect-input');i.removeAttribute('readonly');i.value='';i.focus();var f=document.getElementById(id+'_fb');f.className='fb';f.innerHTML=''}
function showSample(id){
  var fb=document.getElementById(id+'_fb');totalAnswered++;saveProgress();
  fb.className='fb show correct-fb';
  fb.innerHTML='<strong>📝 Model Answer:</strong>'+document.getElementById(id).getAttribute('data-sample')+'<br><br><em style="color:var(--text-dim)">Compare your response. Did you include: (1) direction and magnitude, (2) reference category, (3) "on average," (4) "holding constant" if controls are present?</em><br><button class="retry-btn" onclick="retryText(\''+id+'\')">↻ Try Again</button>';
}
function attachFB(id,c,i){var e=document.getElementById(id);if(e)e.setAttribute('data-fb',JSON.stringify([c,i]))}
function attachSample(id,s){var e=document.getElementById(id);if(e)e.setAttribute('data-sample',s)}

// ═══════════════════════════════════════════
// MODULES
// ═══════════════════════════════════════════
const MODULES=[

// ── 0: WELCOME ──
{id:'intro',title:'Welcome',subtitle:'How this lab works',render(el){
  el.innerHTML=`<h2 class="module-title">Welcome to the Dummy Variables Learning Lab</h2>
  <p class="module-subtitle">Gordon Chapter 7 · Interactive Deep-Dive</p>
  <p>This tool teaches you the core concepts of <span class="hl">dummy variable regression</span> — how to include categorical predictors (like race, gender, or region) in OLS models. Each module includes:</p>
  <div class="card card-accent"><span class="card-label blue">For Every Concept</span>
    <p>📖 <strong>Teaching explanation</strong> — plain-language walkthrough with examples</p>
    <p>🔧 <strong>Interactive explorers</strong> — manipulate reference categories, build equations, visualize parallel lines</p>
    <p>✏️ <strong>Multiple practice questions</strong> — multiple-choice, numerical, and written interpretation</p>
    <p>💬 <strong>Detailed reteaching feedback</strong> — explains <em>why</em> an answer is right or wrong</p>
    <p style="margin:0">↻ <strong>Retry system</strong> — every question can be retried unlimited times</p>
  </div>
  <div class="card card-success"><span class="card-label green">Progress is Saved</span>
    <p style="margin:0">Close the tab and come back anytime — your module position and stats are saved automatically.</p>
  </div>
  <div class="card card-warn"><span class="card-label yellow">Prerequisites</span>
    <p style="margin:0">This lab builds on Chapters 5–6. You should be comfortable with slope interpretation, "holding constant," the F-test, and R² before starting.</p>
  </div>
  <p>Use the sidebar to navigate. Modules build on each other, so working in order is recommended.</p>`;
}},

// ── 1: WHY SPECIAL TREATMENT ──
{id:'why',title:'1. Why Categorical Vars Need Dummies',subtitle:'The problem with numeric codes',render(el){
  const q1=uid(),q2=uid(),q3=uid();
  el.innerHTML=`<h2 class="module-title">Why Categorical Variables Need Special Treatment</h2>
  <p class="module-subtitle">Module 1 · The problem with plugging in numeric codes</p>
  <h3>The Core Problem</h3>
  <p>In Chapters 5–6, every predictor was <span class="hl">interval-level</span> — earnings, age, years of schooling — where the numbers have real mathematical meaning. But what about a variable like <em>race</em>?</p>
  <table class="data-table"><thead><tr><th>Code</th><th>Category</th></tr></thead>
  <tbody><tr><td>1</td><td>African American</td></tr><tr><td>2</td><td>White</td></tr><tr><td>3</td><td>Mexican American</td></tr><tr><td>4</td><td>American Indian</td></tr><tr><td>5</td><td>Other</td></tr></tbody></table>
  <p>If you entered <em>race</em> directly into a regression, the slope would mean "the expected change in Y for a one-unit increase in race." But <strong>going from code 1 to code 2 isn't a meaningful one-unit increase</strong> — it's just moving from one arbitrary label to another.</p>
  <div class="card card-error"><span class="card-label pink">The Proof</span>
  <p style="margin:0">We could recode the same variable as: 4 = American Indian, 41 = Mexican American, 59 = African American, 124 = White, 500 = Other. <strong>Same categories, completely different numbers.</strong> The regression would give a totally different slope — but the data hasn't changed. This proves the codes carry no mathematical content.</p></div>

  <h3>Two Types of Problem Variables</h3>
  <p><span class="hl">Nominal variables</span> (race, religion, region): categories have <em>no order and no distance</em>. Numbers are purely arbitrary.</p>
  <p><span class="hl2">Ordinal variables</span> (education level coded 1–7): categories have <em>order but not equal spacing</em>. Moving from "less than HS" to "HS diploma" is not the same gap as "bachelor's" to "some postgraduate."</p>
  <div class="card card-accent"><span class="card-label blue">Key Concept</span>
  <p style="margin:0">Using an ordinal variable as continuous <strong>implicitly assumes equal spacing</strong> between categories. This assumption is usually wrong. The solution: <span class="hl">dummy variables</span>.</p></div>

  <div class="q-block" id="${q1}"><span class="q-num">Q1 of 3</span>
    <h4>✏️ Why can't we use race (coded 1–5) directly as a predictor?</h4>
    <div id="${q1}_opts">
      <button class="option-btn" onclick="checkMCQ('${q1}',0,1)">A) Because race always has missing data</button>
      <button class="option-btn" onclick="checkMCQ('${q1}',1,1)">B) Because the numeric codes are arbitrary labels — a "one-unit increase" has no real meaning</button>
      <button class="option-btn" onclick="checkMCQ('${q1}',2,1)">C) Because race has too many categories</button>
      <button class="option-btn" onclick="checkMCQ('${q1}',3,1)">D) Because categorical variables are always insignificant</button>
    </div><div class="fb" id="${q1}_fb"></div>
  </div>

  <div class="q-block" id="${q2}"><span class="q-num">Q2 of 3</span>
    <h4>✏️ What does it mean that ordinal codes have "order but not distance"?</h4>
    <div id="${q2}_opts">
      <button class="option-btn" onclick="checkMCQ('${q2}',0,0)">A) We know the categories are ranked (e.g., HS &lt; bachelor's &lt; graduate), but the gap between adjacent categories is not necessarily equal — moving from code 1 to 2 doesn't mean the same substantive change as 5 to 6.</button>
      <button class="option-btn" onclick="checkMCQ('${q2}',1,0)">B) The categories have no meaningful sequence at all</button>
      <button class="option-btn" onclick="checkMCQ('${q2}',2,0)">C) The codes can only be used with non-parametric tests</button>
    </div><div class="fb" id="${q2}_fb"></div>
  </div>

  <div class="q-block" id="${q3}"><span class="q-num">Q3 of 3</span>
    <h4>✏️ If you used education (coded 1 = less-than-HS through 7 = graduate degree) as a continuous predictor, what assumption are you implicitly making?</h4>
    <div id="${q3}_opts">
      <button class="option-btn" onclick="checkMCQ('${q3}',0,1)">A) That education has no effect on the outcome</button>
      <button class="option-btn" onclick="checkMCQ('${q3}',1,1)">B) That the effect of moving one code higher is the same everywhere on the scale — equal spacing between all categories</button>
      <button class="option-btn" onclick="checkMCQ('${q3}',2,1)">C) That the relationship is nonlinear</button>
    </div><div class="fb" id="${q3}_fb"></div>
  </div>`;
  attachFB(q1,' The numeric codes assigned to nominal categories are arbitrary labels. A regression slope assumes a one-unit change means the same thing everywhere — but "going from African American to White" is not a meaningful unit increase. The solution: dummy variables.',' The core issue is that the codes are <em>arbitrary labels</em>, not quantities. A one-unit increase on a nominal variable has no substantive meaning.');
  attachFB(q2,' Ordinal variables preserve rank order (we know a bachelor\'s degree > a HS diploma), but the <em>gaps</em> between categories aren\'t necessarily equal. Using the codes as continuous forces the assumption that each one-unit increase has the same effect.',' Ordinal means we know the <em>ranking</em> (category 3 > category 2 > category 1), but the <em>distance</em> between adjacent categories isn\'t necessarily equal.');
  attachFB(q3,' A continuous predictor in regression assumes each one-unit increase has the same effect on Y. For ordinal education codes, this means assuming the gap between "less than HS" and "HS diploma" is the same as between "bachelor\'s" and "some postgraduate" — almost certainly wrong.',' Using ordinal codes as continuous assumes <strong>equal spacing</strong>: each one-unit increase has the same effect. Chapter 9 will show how to relax this assumption using dummy variables for ordinal predictors.');
}},

// ── 2: DEFINING DUMMIES & c-1 ──
{id:'c1rule',title:'2. Dummy Variables & the c − 1 Rule',subtitle:'Building and counting dummies',render(el){
  const q1=uid(),q2=uid(),q3=uid(),q4=uid();
  el.innerHTML=`<h2 class="module-title">Defining Dummy Variables &amp; the c − 1 Rule</h2>
  <p class="module-subtitle">Module 2 · The mechanics of dummy coding</p>
  <h3>What Is a Dummy Variable?</h3>
  <p>A <span class="hl">dummy variable</span> (also called an <span class="hl">indicator variable</span>) is a binary variable coded <strong>1</strong> for cases in a specific category and <strong>0</strong> for all other cases.</p>
  <table class="data-table"><thead><tr><th>Original Race</th><th>aframer</th><th>white</th><th>mexamer</th><th>amind</th><th>other</th></tr></thead>
  <tbody>
  <tr><td>1 = African American</td><td class="hl-cell">1</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
  <tr><td>2 = White</td><td>0</td><td class="hl-cell">1</td><td>0</td><td>0</td><td>0</td></tr>
  <tr><td>3 = Mexican American</td><td>0</td><td>0</td><td class="hl-cell">1</td><td>0</td><td>0</td></tr>
  <tr><td>4 = American Indian</td><td>0</td><td>0</td><td>0</td><td class="hl-cell">1</td><td>0</td></tr>
  <tr><td>5 = Other</td><td>0</td><td>0</td><td>0</td><td>0</td><td class="hl-cell">1</td></tr>
  </tbody></table>
  <p>Each case gets a 1 on exactly one dummy and 0 on all the rest.</p>

  <h3>The c − 1 Rule</h3>
  <div class="formula-block">Dummies in model = c − 1<br><span style="font-size:12px;color:var(--text-dim)">where c = number of categories</span></div>
  <p>You include <strong>c − 1</strong> dummies. One is left out — its category becomes the <span class="hl2">reference category</span> (also called the omitted or excluded category).</p>
  <p><strong>Why?</strong> Because the dummies are perfectly dependent: if you know someone scores 0 on four of the five, they <em>must</em> score 1 on the fifth. Including all c dummies creates <span class="hl3">perfect multicollinearity</span> — estimation fails.</p>
  <div class="card card-error"><span class="card-label pink">The Dummy Variable Trap</span>
  <p style="margin:0">Including all c dummies (rather than c − 1) is called the "dummy variable trap." Stata detects this and automatically drops one, but you should understand <em>why</em> rather than relying on the software.</p></div>

  <div class="interactive-zone">
    <h4>🔧 The c − 1 Rule Calculator</h4>
    <p>Adjust the number of categories to see how many dummies you need:</p>
    <div class="slider-group"><label>Number of categories (c): <span id="cV">4</span></label>
    <input type="range" min="2" max="10" value="4" id="cS" oninput="updC()"></div>
    <div class="computed-result" id="cR"></div>
  </div>

  <div class="q-block" id="${q1}"><span class="q-num">Q1 of 4</span>
    <h4>✏️ A variable for region has 4 categories: Northeast, South, Midwest, West. How many dummies go in the model?</h4>
    <div class="text-input-group"><input type="text" class="text-input" id="${q1}_input" placeholder="Enter a number..." onkeydown="if(event.key==='Enter')checkText('${q1}')"></div>
    <button class="check-btn" onclick="checkText('${q1}')">Check Answer</button>
    <div class="fb" id="${q1}_fb"></div>
  </div>

  <div class="q-block" id="${q2}"><span class="q-num">Q2 of 4</span>
    <h4>✏️ What happens if you include both <em>male</em> AND <em>female</em> dummies (plus a constant) in a regression?</h4>
    <div id="${q2}_opts">
      <button class="option-btn" onclick="checkMCQ('${q2}',0,1)">A) You get more precise estimates</button>
      <button class="option-btn" onclick="checkMCQ('${q2}',1,1)">B) Perfect multicollinearity — estimation fails because male = 1 − female, creating exact linear dependence</button>
      <button class="option-btn" onclick="checkMCQ('${q2}',2,1)">C) Stata estimates both without issue</button>
    </div><div class="fb" id="${q2}_fb"></div>
  </div>

  <div class="q-block" id="${q3}"><span class="q-num">Q3 of 4</span>
    <h4>✏️ Does changing the reference category change R²?</h4>
    <div id="${q3}_opts">
      <button class="option-btn" onclick="checkMCQ('${q3}',0,1)">A) Yes — a better reference gives a higher R²</button>
      <button class="option-btn" onclick="checkMCQ('${q3}',1,1)">B) No — R², SSE, the F-test, and all overall model statistics are identical regardless of which category is the reference</button>
      <button class="option-btn" onclick="checkMCQ('${q3}',2,1)">C) Only if the sample sizes are different</button>
    </div><div class="fb" id="${q3}_fb"></div>
  </div>

  <div class="q-block" id="${q4}"><span class="q-num">Q4 of 4</span>
    <h4>✏️ Which of these is a GOOD reason to choose a particular reference category?</h4>
    <div id="${q4}_opts">
      <button class="option-btn" onclick="checkMCQ('${q4}',0,0)">A) It's the group you expect to differ from the most other groups (based on theory), and/or it has a relatively large sample size</button>
      <button class="option-btn" onclick="checkMCQ('${q4}',1,0)">B) It's always best to use the first category alphabetically</button>
      <button class="option-btn" onclick="checkMCQ('${q4}',2,0)">C) It doesn't matter — just let Stata choose</button>
    </div><div class="fb" id="${q4}_fb"></div>
  </div>`;

  window['ck_'+q1]=function(v){return parseFloat(v)===3};
  document.getElementById(q1).setAttribute('data-checker','ck_'+q1);
  document.getElementById(q1).setAttribute('data-cfb',encodeURIComponent(' c − 1 = 4 − 1 = <strong>3</strong> dummies. One region (your choice) becomes the reference category.'));
  document.getElementById(q1).setAttribute('data-ifb',encodeURIComponent(' c − 1 = 4 − 1 = <strong>3</strong>. With 4 regions, you need 3 dummies in the model. The 4th category is the reference.'));
  attachFB(q2,' Since male + female = 1 for every case, including both with a constant creates perfect collinearity (male = 1 − female). OLS cannot estimate the model. Stata drops one automatically, but understanding <em>why</em> is essential.',' Including both creates <strong>perfect multicollinearity</strong>. Since male = 1 − female, one is a perfect linear function of the other. OLS cannot compute unique estimates.');
  attachFB(q3,' Changing the reference is a <em>reparameterization</em> of the same model. The fit is identical — only the individual coefficients (and their interpretation) change. This is a frequently tested concept.',' R², SSE, TSS, MSS, and the model F-test are <strong>all unchanged</strong>. Only the individual coefficients and intercept change, because they now measure contrasts with a different baseline.');
  attachFB(q4,' Choose based on <strong>theory</strong> (which comparisons matter?) and <strong>sample size</strong> (larger groups give smaller standard errors). A small reference group inflates all SEs.',' Choose based on substantive interest and sample size. A group with very few cases will produce large standard errors for every contrast.');

  window.updC=function(){var c=+document.getElementById('cS').value;document.getElementById('cV').textContent=c;
    document.getElementById('cR').innerHTML='<span class="val2" style="font-size:20px">'+(c-1)+'</span> dummies in the model &nbsp;|&nbsp; <span class="val">1</span> reference category<br><span style="font-size:12px;color:var(--text-dim)">'+c+' categories → '+c+' dummies created → '+(c-1)+' included + 1 excluded</span>';
  };setTimeout(updC,50);
}},

// ── 3: SINGLE DUMMY MODEL ──
{id:'single',title:'3. The Single Dummy Variable Model',subtitle:'Intercept = reference mean, slope = difference',render(el){
  const q1=uid(),q2=uid(),q3=uid(),q4=uid();
  el.innerHTML=`<h2 class="module-title">The Single Dummy Variable Model</h2>
  <p class="module-subtitle">Module 3 · The interpretive core of Chapter 7</p>
  <h3>Setting Up the Model</h3>
  <p>Consider predicting distance from mother using gender. Let <em>female</em> = 1 for women, 0 for men:</p>
  <div class="formula-block">Y<sub>i</sub> = β₀ + β₁ · D<sub>i</sub> + ε<sub>i</sub><br><span style="font-size:12px;color:var(--text-dim)">D = female (1 for women, 0 for men)</span></div>

  <h3>The Key Derivation</h3>
  <p>Since D can only be 0 or 1, substitute both values:</p>
  <table class="data-table"><thead><tr><th>Group</th><th>D value</th><th>Expected Y</th></tr></thead>
  <tbody>
  <tr><td><strong>Men (reference)</strong></td><td class="ref-cell">D = 0</td><td>E(Y) = β₀ + β₁(0) = <span class="hl">β₀</span></td></tr>
  <tr><td><strong>Women (included)</strong></td><td class="hl-cell">D = 1</td><td>E(Y) = β₀ + β₁(1) = β₀ + β₁</td></tr>
  </tbody></table>
  <p>The difference: (β₀ + β₁) − β₀ = <span class="hl">β₁</span></p>
  <div class="card card-accent"><span class="card-label blue">Core Interpretation Rule</span>
    <p><strong>Intercept (β₀)</strong> = mean of Y for the <em>reference category</em> (D = 0)</p>
    <p style="margin:0"><strong>Coefficient (β₁)</strong> = difference in means: included category − reference category</p>
  </div>

  <h3>Gordon's Example</h3>
  <div class="stata-block">regress g1miles female

  g1miles |    Coef.   Std.Err.     t     P>|t|
  --------+------------------------------------
   female | -59.3879   17.7077   -3.35   0.001
    _cons | 323.7556   13.7426   23.56   0.000</div>
  <p>Intercept = <span class="hl">323.76</span> (mean miles for men). Coefficient = <span class="hl3">−59.39</span> (women live ~59 miles <em>closer</em> to their mothers than men).</p>
  <p>Mean for women: 323.76 − 59.39 = <span class="hl2">264.37</span></p>

  <div class="card card-success"><span class="card-label green">Switching the Reference</span>
  <p style="margin:0">If you create <em>male</em> instead: intercept becomes 264.37 (women's mean), coefficient becomes +59.39. <strong>Same magnitude, opposite sign.</strong> Same t-value, same p-value.</p></div>

  <div class="interactive-zone">
    <h4>🔧 Build Your Own Single Dummy Model</h4>
    <p>Set the group means to see the regression equation:</p>
    <div class="slider-group"><label>Mean for Reference Group (D=0): <span id="m0V">324</span></label>
    <input type="range" min="100" max="500" value="324" id="m0S" oninput="updSD()"></div>
    <div class="slider-group"><label>Mean for Included Group (D=1): <span id="m1V">264</span></label>
    <input type="range" min="100" max="500" value="264" id="m1S" oninput="updSD()"></div>
    <div class="computed-result" id="sdR"></div>
  </div>

  <div class="q-block" id="${q1}"><span class="q-num">Q1 of 4</span>
    <h4>✏️ In the model Ŷ = 323.76 − 59.39 × female, what is the predicted distance for women?</h4>
    <div class="text-input-group"><input type="text" class="text-input" id="${q1}_input" placeholder="Enter a number..." onkeydown="if(event.key==='Enter')checkText('${q1}')"></div>
    <button class="check-btn" onclick="checkText('${q1}')">Check Answer</button>
    <div class="fb" id="${q1}_fb"></div>
  </div>

  <div class="q-block" id="${q2}"><span class="q-num">Q2 of 4</span>
    <h4>✍️ Write a complete interpretation of the female coefficient (−59.39):</h4>
    <div class="text-input-group"><textarea class="text-input" id="${q2}_input" placeholder="On average, women..." rows="3"></textarea></div>
    <button class="check-btn" onclick="showSample('${q2}')">Compare to Model Answer</button>
    <div class="fb" id="${q2}_fb"></div>
  </div>

  <div class="q-block" id="${q3}"><span class="q-num">Q3 of 4</span>
    <h4>✏️ The t-test for β₁ = 0 tests which null hypothesis?</h4>
    <div id="${q3}_opts">
      <button class="option-btn" onclick="checkMCQ('${q3}',0,1)">A) Women live closer to their mothers than men</button>
      <button class="option-btn" onclick="checkMCQ('${q3}',1,1)">B) The mean distance from mother is the same for men and women — i.e., the two group means are equal</button>
      <button class="option-btn" onclick="checkMCQ('${q3}',2,1)">C) The regression model is a good fit</button>
    </div><div class="fb" id="${q3}_fb"></div>
  </div>

  <div class="q-block" id="${q4}"><span class="q-num">Q4 of 4</span>
    <h4>✏️ A dummy variable regression with one predictor is mathematically equivalent to:</h4>
    <div id="${q4}_opts">
      <button class="option-btn" onclick="checkMCQ('${q4}',0,0)">A) A two-sample t-test for equal means — the t-statistic, difference in means, and p-value are identical</button>
      <button class="option-btn" onclick="checkMCQ('${q4}',1,0)">B) A chi-squared test</button>
      <button class="option-btn" onclick="checkMCQ('${q4}',2,0)">C) A correlation test</button>
    </div><div class="fb" id="${q4}_fb"></div>
  </div>`;

  window['ck_'+q1]=function(v){var n=parseFloat(v);return n>=264&&n<=265};
  document.getElementById(q1).setAttribute('data-checker','ck_'+q1);
  document.getElementById(q1).setAttribute('data-cfb',encodeURIComponent(' Ŷ = 323.76 + (−59.39)(1) = 323.76 − 59.39 = <strong>264.37 miles</strong>. The intercept is the men\'s mean; adding the coefficient gives the women\'s mean.'));
  document.getElementById(q1).setAttribute('data-ifb',encodeURIComponent(' For women, female = 1: Ŷ = 323.76 + (−59.39)(1) = 323.76 − 59.39 = <strong>264.37 miles</strong>.'));
  attachSample(q2,' "On average, adult women live approximately 59 miles closer to their mothers than do adult men. This difference is statistically significant (t = −3.35, p = .001)."');
  attachFB(q3,' When β₁ = 0, E(Y|D=1) = β₀ + 0 = β₀ = E(Y|D=0). The two group means are equal. Rejecting H₀ means the groups have significantly different means on the outcome.',' H₀: β₁ = 0 means the difference in group means is zero — i.e., men and women have the <strong>same average</strong> distance from mother.');
  attachFB(q4,' Gordon demonstrates this in Display 7.5. The regression t-value (3.35) matches the two-sample t-test exactly. The advantage of regression: you can <em>add controls</em>, which a simple t-test cannot.',' A bivariate dummy regression and a two-sample t-test produce <strong>identical</strong> results: same t-value, difference in means, and p-value.');

  window.updSD=function(){var m0=+document.getElementById('m0S').value,m1=+document.getElementById('m1S').value,d=m1-m0,s=d>=0?'+':'';
    document.getElementById('m0V').textContent=m0;document.getElementById('m1V').textContent=m1;
    document.getElementById('sdR').innerHTML='<strong>Ŷ = '+m0+' '+s+d+' × D</strong>\n\nIntercept (β̂₀) = <span class="val">'+m0+'</span>  ← Mean for reference (D=0)\nCoefficient (β̂₁) = <span class="val2">'+s+d+'</span>  ← Difference: included − reference\n\nPredicted for D=0: <span class="val">'+m0+'</span>\nPredicted for D=1: '+m0+' + ('+d+') = <span class="val2">'+m1+'</span>';
  };setTimeout(updSD,50);
}},

// ── 4: MULTI-CATEGORY ──
{id:'multi',title:'4. Multi-Category Dummy Models',subtitle:'c − 1 dummies in action',render(el){
  const q1=uid(),q2=uid(),q3=uid(),q4=uid();
  const gm=[240.97,398.00,232.72,297.69],gn=['African American','American Indian','Mexican American','White'];
  el.innerHTML=`<h2 class="module-title">Multi-Category Dummy Models</h2>
  <p class="module-subtitle">Module 4 · Three dummies, one reference, many contrasts</p>
  <h3>The Setup</h3>
  <p>Four race-ethnicity groups, African Americans as reference:</p>
  <div class="formula-block">Y<sub>i</sub> = β₀ + β₁(amind) + β₂(mexamer) + β₃(white) + ε<sub>i</sub></div>
  <table class="data-table"><thead><tr><th>Group</th><th>amind</th><th>mexamer</th><th>white</th><th>E(Y)</th></tr></thead>
  <tbody>
  <tr><td>African American <span style="color:var(--warn)">(ref)</span></td><td class="ref-cell">0</td><td class="ref-cell">0</td><td class="ref-cell">0</td><td class="hl-cell">β₀ = 240.97</td></tr>
  <tr><td>American Indian</td><td class="hl-cell">1</td><td>0</td><td>0</td><td>β₀ + β₁ = 398.00</td></tr>
  <tr><td>Mexican American</td><td>0</td><td class="hl-cell">1</td><td>0</td><td>β₀ + β₂ = 232.72</td></tr>
  <tr><td>White</td><td>0</td><td>0</td><td class="hl-cell">1</td><td>β₀ + β₃ = 297.69</td></tr>
  </tbody></table>
  <p>Each coefficient is the <strong>difference from the reference</strong>. For example: β̂₃ = 56.72 means whites live ~57 miles <em>farther</em> from their mothers than African Americans.</p>

  <div class="card card-warn"><span class="card-label yellow">Critical Limitation</span>
  <p style="margin:0">The default output ONLY shows contrasts with the reference category. Contrasts between <em>included</em> categories (e.g., American Indian vs. Mexican American) are <strong>not</strong> directly in the output — you need <code>test</code> or <code>lincom</code>.</p></div>

  <div class="interactive-zone">
    <h4>🔧 Switch the Reference Category</h4>

    <div class="fb" id="${q1}_fb"></div>
  </div>

  <div class="q-block" id="${q2}"><span class="q-num">Q2 of 4</span>
    <h4>✏️ The coefficient for American Indians is 157.03 but its p-value is 0.225 (not significant). Why might this happen despite such a large coefficient?</h4>
    <div id="${q2}_opts">
      <button class="option-btn" onclick="checkMCQ('${q2}',0,0)">A) The coefficient is biased</button>
      <button class="option-btn" onclick="checkMCQ('${q2}',1,0)">B) American Indians have a very small sample size (n ≈ 25), producing a huge standard error (129.49) that overwhelms the large coefficient, resulting in a small t-value</button>
      <button class="option-btn" onclick="checkMCQ('${q2}',2,0)">C) The reference category is wrong</button>
    </div><div class="fb" id="${q2}_fb"></div>
  </div>

  <div class="q-block" id="${q3}"><span class="q-num">Q3 of 4</span>

    <div class="text-input-group"><input type="text" class="text-input" id="${q3}_input" placeholder="β̂_white − β̂_mexamer = ..." onkeydown="if(event.key==='Enter')checkText('${q3}')"></div>
    <button class="check-btn" onclick="checkText('${q3}')">Check Answer</button>

  <div class="q-block" id="${q4}"><span class="q-num">Q4 of 4</span>

  </div>`;

  window['ck_'+q1]=function(v){var n=parseFloat(v);return n>=232&&n<=233};
  document.getElementById(q1).setAttribute('data-checker','ck_'+q1);
  document.getElementById(q1).setAttribute('data-cfb',encodeURIComponent(' 240.97 + (−8.25) = <strong>232.72 miles</strong>. The intercept gives the reference mean; add each coefficient to get each group\'s predicted value.'));
  document.getElementById(q1).setAttribute('data-ifb',encodeURIComponent(' Predicted = intercept + coefficient = 240.97 + (−8.25) = <strong>232.72</strong>.'));
  attachFB(q2,' Small sample sizes produce large standard errors. The coefficient (157.03) is the <em>best</em> OLS estimate, but with SE = 129.49, t = 157.03/129.49 = 1.21 — far below the critical value. This is a <strong>power</strong> problem, not a bias problem.',' With only ~25 American Indians in the sample, the standard error is enormous (129.49). The t-value = 157.03/129.49 = 1.21, which is too small to reject H₀. Small samples → low power.');
  window['ck_'+q3]=function(v){var n=parseFloat(v);return(n>=64.9&&n<=65)||v==='64.97'};
  document.getElementById(q3).setAttribute('data-checker','ck_'+q3);
  document.getElementById(q3).setAttribute('data-cfb',encodeURIComponent(' β̂₃ − β̂₂ = 56.72 − (−8.25) = <strong>64.97 miles</strong>. Whites live about 65 miles farther from their mothers than Mexican Americans. But is this statistically significant? The default output doesn\'t say — you\'d need <code>lincom</code>.'));
  document.getElementById(q3).setAttribute('data-ifb',encodeURIComponent(' Subtract the coefficients: 56.72 − (−8.25) = 56.72 + 8.25 = <strong>64.97</strong>. This is the difference in predicted means between the two included groups.'));
  attachFB(q4,' The default output only tests each included category against the <em>reference</em>. Contrasts between two included categories require <code>test amind=mexamer</code> or <code>lincom white-mexamer</code>. On exams, <strong>explicitly state</strong> when a test is not in the default output.',' Contrasts between <strong>included</strong> categories require additional commands. The default output only shows contrasts with the reference category.');

  // Reference category switcher
  window.switchRefPill=function(ri){
    document.querySelectorAll('#refPills .ref-pill').forEach((p,i)=>p.classList.toggle('active',i===ri));
    var int=gm[ri],lines=gn[ri]+' is reference (intercept = '+int.toFixed(2)+')\n\n';
    [0,1,2,3].filter(i=>i!==ri).forEach(i=>{var c=(gm[i]-gm[ri]).toFixed(2),s=gm[i]>=gm[ri]?'+':'';
      lines+=gn[i].padEnd(22)+' β̂ = '+s+c+'   (predicted = '+gm[i].toFixed(2)+')\n'});
    lines+='\nR² = 0.0013   F(3, 5397) = 2.42   ← UNCHANGED';
    document.getElementById('refR').textContent=lines;
  };
  document.getElementById('refPills').innerHTML=gn.map((n,i)=>'<span class="ref-pill'+(i===0?' active':'')+'" onclick="switchRefPill('+i+')">'+n+'</span>').join('');
  setTimeout(()=>switchRefPill(0),50);
}},

// ── 5: TESTING CONTRASTS ──
{id:'contrasts',title:'5. Testing Contrasts Among Included Groups',subtitle:'test, lincom, and re-estimation',render(el){
  const q1=uid(),q2=uid(),q3=uid(),q4=uid();
  el.innerHTML=`<h2 class="module-title">Testing Contrasts Among Included Categories</h2>
  <p class="module-subtitle">Module 5 · Three approaches, one answer</p>
  <h3>The Problem</h3>
  <p>With African Americans as reference, the output directly tests: Am. Indian vs. Afr. Am., Mex. Am. vs. Afr. Am., and White vs. Afr. Am. But what about <strong>Am. Indian vs. Mex. Am.</strong>? That contrast is NOT in the default output.</p>

  <h3>Approach 1: Re-estimate with a Different Reference</h3>
  <div class="stata-block"><span style="color:var(--accent)">* Make American Indian the reference:</span>
regress glmiles aframer mexamer white</div>
  <p>✅ Gives coefficient, SE, t, p, CI &nbsp;&nbsp; ⚠️ Cumbersome with many categories</p>

  <h3>Approach 2: The <code>test</code> Command</h3>
  <div class="stata-block"><span style="color:var(--accent)">* After the original regression:</span>
test amind=mexamer    <span style="color:var(--text-dim)">// H₀: β₁ = β₂</span></div>
  <p>✅ Quick, no re-estimation &nbsp;&nbsp; ⚠️ Only gives F and p — NOT the difference, SE, or direction</p>

  <h3>Approach 3: The <code>lincom</code> Command (Preferred)</h3>
  <div class="stata-block"><span style="color:var(--accent)">* After the original regression:</span>
lincom mexamer-amind  <span style="color:var(--text-dim)">// Computes β̂₂ − β̂₁</span></div>
  <p>✅ Gives difference, SE, t, p, and CI — <span class="hl2">all from one model estimation</span></p>

  <div class="card card-accent"><span class="card-label blue">Key Equivalence</span>
  <p style="margin:0">For 1-df tests: <strong>F = t²</strong>. All three approaches give the <strong>same test statistic and p-value</strong>.</p></div>

  <div class="interactive-zone">
    <h4>🔧 Compare All Three Approaches</h4>
    <p>Select a pairwise contrast:</p>
    <div id="contPills" style="margin:8px 0"></div>
    <div class="computed-result" id="contR"></div>
  </div>

  <h3>The SE of a Difference Requires the VCE Matrix</h3>
  <div class="formula-block">SE(β̂₁ − β̂₂) = √[ Var(β̂₁) + Var(β̂₂) − 2·Cov(β̂₁, β̂₂) ]</div>
  <p>You can't just combine individual SEs — you need the <strong>covariance</strong> from <code>estat vce</code>. The <code>lincom</code> command does this automatically.</p>

  <div class="q-block" id="${q1}"><span class="q-num">Q1 of 4</span>
    <h4>✏️ Which approach gives the most complete information from a single estimation?</h4>
    <div id="${q1}_opts">
      <button class="option-btn" onclick="checkMCQ('${q1}',0,2)">A) Re-estimating with a different reference</button>
      <button class="option-btn" onclick="checkMCQ('${q1}',1,2)">B) The test command</button>
      <button class="option-btn" onclick="checkMCQ('${q1}',2,2)">C) The lincom command — it provides the difference, SE, t, p, and CI without re-running the model</button>
    </div><div class="fb" id="${q1}_fb"></div>
  </div>

  <div class="q-block" id="${q2}"><span class="q-num">Q2 of 4</span>
    <h4>✏️ If <code>test amind=mexamer</code> gives F(1, 5397) = 1.46, what is the corresponding |t|-value?</h4>
    <div class="text-input-group"><input type="text" class="text-input" id="${q2}_input" placeholder="√F = ..." onkeydown="if(event.key==='Enter')checkText('${q2}')"></div>
    <button class="check-btn" onclick="checkText('${q2}')">Check Answer</button>
    <div class="fb" id="${q2}_fb"></div>
  </div>

  <div class="q-block" id="${q3}"><span class="q-num">Q3 of 4</span>
    <h4>✏️ Given: Var(β̂₁) = 16,766.64, Var(β̂₂) = 2,968.48, Cov = 522.00. Calculate SE(β̂₁ − β̂₂):</h4>
    <div class="text-input-group"><input type="text" class="text-input" id="${q3}_input" placeholder="√(V1 + V2 − 2Cov) = ..." onkeydown="if(event.key==='Enter')checkText('${q3}')"></div>
    <button class="check-btn" onclick="checkText('${q3}')">Check Answer</button>
    <div class="fb" id="${q3}_fb"></div>
    <div class="expandable" style="margin-top:16px">
      <button class="expand-trigger" onclick="toggleExpand(this)"><span class="arrow">▶</span> Show step-by-step</button>
      <div class="expand-content">
        <p>Var(β̂₁) + Var(β̂₂) − 2·Cov = 16,766.64 + 2,968.48 − 2(522.00)</p>
        <p>= 16,766.64 + 2,968.48 − 1,044.00 = 18,691.12</p>
        <p>SE = √18,691.12 = <strong>136.72</strong></p>
      </div>
    </div>
  </div>

  <div class="q-block" id="${q4}"><span class="q-num">Q4 of 4</span>
    <h4>✏️ Why can't you just add or subtract individual SEs to get the SE of a difference?</h4>
    <div id="${q4}_opts">
      <button class="option-btn" onclick="checkMCQ('${q4}',0,0)">A) Because the formula for the variance of a difference includes a covariance term (−2·Cov) — the sampling distributions of the two coefficients are correlated</button>
      <button class="option-btn" onclick="checkMCQ('${q4}',1,0)">B) Because standard errors can never be combined</button>
      <button class="option-btn" onclick="checkMCQ('${q4}',2,0)">C) Because the SEs are always too large</button>
    </div><div class="fb" id="${q4}_fb"></div>
  </div>`;

  attachFB(q1,' <code>lincom</code> computes the difference, its SE (using the VCE matrix), t-value, p-value, and 95% CI — all from a single model run. Gordon recommends it as the default tool.',' <code>lincom</code> is the most informative single-step tool. <code>test</code> only gives F and p. Re-estimation requires running the model again.');
  window['ck_'+q2]=function(v){var n=parseFloat(v);return n>=1.20&&n<=1.22};
  document.getElementById(q2).setAttribute('data-checker','ck_'+q2);
  document.getElementById(q2).setAttribute('data-cfb',encodeURIComponent(' √1.46 = <strong>1.21</strong>. When there\'s 1 numerator df, F = t², so |t| = √F. This is the same t-value <code>lincom</code> reports.'));
  document.getElementById(q2).setAttribute('data-ifb',encodeURIComponent(' |t| = √F = √1.46 = <strong>1.21</strong>. The F = t² equivalence holds for any test with 1 numerator df.'));
  window['ck_'+q3]=function(v){var n=parseFloat(v);return n>=136.5&&n<=137};
  document.getElementById(q3).setAttribute('data-checker','ck_'+q3);
  document.getElementById(q3).setAttribute('data-cfb',encodeURIComponent(' √(16766.64 + 2968.48 − 2×522.00) = √18691.12 = <strong>136.72</strong>. This matches Display 7.11 in Gordon.'));
  document.getElementById(q3).setAttribute('data-ifb',encodeURIComponent(' √(16,766.64 + 2,968.48 − 1,044.00) = √18,691.12 = <strong>136.72</strong>. See the step-by-step below.'));
  attachFB(q4,' The variance of a linear combination aX₁ + bX₂ is a²Var(X₁) + b²Var(X₂) + 2ab·Cov(X₁,X₂). For a difference (a=1, b=−1), the covariance term is −2·Cov. Ignoring it gives the wrong SE.',' The formula Var(β̂₁ − β̂₂) = Var(β̂₁) + Var(β̂₂) <strong>− 2·Cov(β̂₁, β̂₂)</strong>. The covariance term accounts for the correlation between the sampling distributions. Without it, the SE is wrong.');

  var conts=[{a:'Amer. Indian vs. Mex. American',diff:-165.28,se:136.72,t:-1.21,f:1.46,p:.227},
    {a:'Amer. Indian vs. White',diff:-100.31,se:127.81,t:-0.78,f:0.62,p:.433},
    {a:'Mex. American vs. White',diff:64.97,se:50.38,t:1.29,f:1.66,p:.197}];
  window.showCont=function(ci){
    document.querySelectorAll('#contPills .ref-pill').forEach((p,i)=>p.classList.toggle('active',i===ci));
    var c=conts[ci];
    document.getElementById('contR').textContent=
      c.a+'\n\n'+
      'Approach 1 (re-estimate): Coef = '+c.diff.toFixed(2)+', SE = '+c.se.toFixed(2)+', t = '+c.t.toFixed(2)+', p = '+c.p.toFixed(3)+'\n'+
      'Approach 2 (test):        F(1, 5397) = '+c.f.toFixed(2)+',  p = '+c.p.toFixed(4)+'\n'+
      'Approach 3 (lincom):      Coef = '+c.diff.toFixed(2)+', SE = '+c.se.toFixed(2)+', t = '+c.t.toFixed(2)+', p = '+c.p.toFixed(3)+'\n\n'+
      'Note: √'+c.f.toFixed(2)+' = '+Math.sqrt(c.f).toFixed(2)+' ≈ |t| = '+Math.abs(c.t).toFixed(2)+'  (F = t² equivalence)\n'+
      'Conclusion: '+(c.p<.05?'Reject H₀ — significant at α = .05':'Fail to reject H₀ — not significant at α = .05');
  };
  document.getElementById('contPills').innerHTML=conts.map((c,i)=>'<span class="ref-pill'+(i===0?' active':'')+'" onclick="showCont('+i+')">'+c.a+'</span>').join('');
  setTimeout(()=>showCont(0),50);
}},

// ── 6: FACTOR VARIABLES ──
{id:'factor',title:'6. Factor Variable Syntax in Stata',subtitle:'i. prefix and ib#. base syntax',render(el){
  const q1=uid(),q2=uid(),q3=uid();
  el.innerHTML=`<h2 class="module-title">Factor Variable Syntax in Stata</h2>
  <p class="module-subtitle">Module 6 · Same results, much less code</p>
  <h3>Manual vs. Factor Variable</h3>
  <table class="data-table"><thead><tr><th style="width:50%">Manual Approach (5 lines)</th><th>Factor Variable (1 line)</th></tr></thead>
  <tbody><tr><td><code>gen aframer=(M484==1) if M484&lt;97</code><br><code>gen white=(M484==2) if M484&lt;97</code><br><code>gen mexamer=(M484==3) if M484&lt;97</code><br><code>gen amind=(M484==7) if M484&lt;97</code><br><code>regress glmiles amind mexamer white</code></td>
  <td><code>regress glmiles ib1.M484</code><br><br><span style="color:var(--success);font-size:12px">Identical results!</span></td></tr></tbody></table>

  <h3>Key Syntax</h3>
  <div class="stata-block"><span style="color:var(--accent)">* i. = treat as categorical (lowest value = reference)</span>
regress Y i.race

<span style="color:var(--accent)">* ib#. = set category # as the base (reference)</span>
regress Y ib2.race    <span style="color:var(--text-dim)">// category 2 = reference</span>

<span style="color:var(--accent)">* test and lincom with factor syntax</span>
test 7.M484=3.M484
lincom 7.M484-3.M484</div>

  <div class="card card-error"><span class="card-label pink">Critical Warning</span>
  <p style="margin:0"><strong>Recode missing values to <code>.</code> before using <code>i.</code></strong>. If codes 97 and 99 mean "refused" and "no answer," Stata will create dummies for those values — producing nonsensical results.</p></div>

  <div class="q-block" id="${q1}"><span class="q-num">Q1 of 3</span>
    <h4>✏️ What does <code>regress WrkHrsSA ib2.GenderSA</code> do?</h4>
    <div id="${q1}_opts">
      <button class="option-btn" onclick="checkMCQ('${q1}',0,1)">A) Regresses WrkHrsSA on GenderSA squared</button>
      <button class="option-btn" onclick="checkMCQ('${q1}',1,1)">B) Creates virtual dummies for GenderSA, uses category 2 as the reference, and regresses WrkHrsSA on the remaining dummies</button>
      <button class="option-btn" onclick="checkMCQ('${q1}',2,1)">C) Multiplies GenderSA by 2</button>
    </div><div class="fb" id="${q1}_fb"></div>
  </div>

  <div class="q-block" id="${q2}"><span class="q-num">Q2 of 3</span>
    <h4>✏️ In factor variable output, what does <code>2.M484</code> refer to?</h4>
    <div id="${q2}_opts">
      <button class="option-btn" onclick="checkMCQ('${q2}',0,0)">A) The virtual dummy variable for category 2 of M484 — i.e., the coefficient for that category relative to the reference</button>
      <button class="option-btn" onclick="checkMCQ('${q2}',1,0)">B) M484 multiplied by 2</button>
      <button class="option-btn" onclick="checkMCQ('${q2}',2,0)">C) The second observation in the dataset</button>
    </div><div class="fb" id="${q2}_fb"></div>
  </div>

  <div class="q-block" id="${q3}"><span class="q-num">Q3 of 3</span>
    <h4>✏️ If you forget to recode missing values (97, 99) to <code>.</code> before using <code>i.M484</code>, what happens?</h4>
    <div id="${q3}_opts">
      <button class="option-btn" onclick="checkMCQ('${q3}',0,0)">A) Stata ignores them automatically</button>
      <button class="option-btn" onclick="checkMCQ('${q3}',1,0)">B) Stata creates dummies for codes 97 and 99 as if they were real categories — producing meaningless results</button>
      <button class="option-btn" onclick="checkMCQ('${q3}',2,0)">C) Stata gives an error</button>
    </div><div class="fb" id="${q3}_fb"></div>
  </div>`;

  attachFB(q1,' The <code>i</code> prefix treats GenderSA as categorical, <code>b2</code> sets category 2 as the base. Stata creates virtual dummies, excludes category 2, and shows the coefficient for category 1 relative to category 2.',' <code>ib2.</code> = treat as <strong>i</strong>ndicator with <strong>b</strong>ase category <strong>2</strong>. Stata auto-creates dummies and uses category 2 as the reference.');
  attachFB(q2,' In factor variable output, <code>#.varname</code> labels represent virtual dummy variables. <code>2.M484</code> is the coefficient for category 2 relative to the reference.',' <code>2.M484</code> is Stata\'s notation for the virtual dummy representing category 2 of M484.');
  attachFB(q3,' Stata treats every unique integer value as a valid category. Codes 97 and 99 would become categories in the regression — "refused" and "no answer" — with their own dummy coefficients. Always recode to <code>.</code> first.',' Stata has no way to know that 97 and 99 are missing codes. It creates dummies for them, treating "refused" as a real racial-ethnic category.');
}},

// ── 7: ADDITIVE MODEL ──
{id:'additive',title:'7. Combining Dummies & Continuous Vars',subtitle:'Parallel lines and the additive model',render(el){
  const q1=uid(),q2=uid(),q3=uid();
  el.innerHTML=`<h2 class="module-title">Combining Dummies with Continuous Variables</h2>
  <p class="module-subtitle">Module 7 · The additive model and parallel regression lines</p>
  <h3>The Full Model</h3>
  <div class="stata-block">regress glmiles amind mexamer white female ///
  g2earn g2age g2numbro g2numsis g1yrschl g1age</div>
  <p>Dummy coefficients now include <strong>"holding constant"</strong>: "Controlling for gender, earnings, and other covariates, white adults live about 35 miles farther from their mothers than African American adults, on average."</p>

  <h3>Parallel Regression Lines</h3>
  <p>The additive model produces <strong>parallel lines</strong>: the slope of each continuous variable is the <em>same</em> for all groups. Only the intercepts differ.</p>

  <div class="interactive-zone">
    <h4>🔧 Visualize the Parallel Lines</h4>
    <p>Adjust the female coefficient and mother's schooling slope:</p>
    <div class="slider-group"><label>Female coefficient (β̂₄): <span id="fcV">−34</span></label>
    <input type="range" min="-80" max="0" value="-34" id="fcS" oninput="drawPL()"></div>
    <div class="slider-group"><label>Schooling slope (β̂₉): <span id="ssV">21</span></label>
    <input type="range" min="5" max="40" value="21" id="ssS" oninput="drawPL()"></div>
    <canvas class="chart" id="plC" height="280"></canvas>
    <p style="font-size:12px;color:var(--text-dim);margin-top:8px">Same slope (effect of schooling), different intercepts (the gap = female coefficient). This is what "additive" means.</p>
  </div>

  <div class="card card-accent"><span class="card-label blue">Looking Ahead: Chapter 8</span>
  <p style="margin:0">The additive model <em>assumes</em> equal slopes across groups. Chapter 8 adds <strong>interaction terms</strong> that allow slopes to differ — the lines are no longer forced to be parallel.</p></div>

  <div class="q-block" id="${q1}"><span class="q-num">Q1 of 3</span>
    <h4>✏️ In an additive model with dummies and continuous variables, "parallel regression lines" means:</h4>
    <div id="${q1}_opts">
      <button class="option-btn" onclick="checkMCQ('${q1}',0,1)">A) Men and women have the same mean on Y</button>
      <button class="option-btn" onclick="checkMCQ('${q1}',1,1)">B) The slope of each continuous variable is the same for all groups — only the intercepts differ</button>
      <button class="option-btn" onclick="checkMCQ('${q1}',2,1)">C) All predictors have the same coefficient</button>
    </div><div class="fb" id="${q1}_fb"></div>
  </div>

  <div class="q-block" id="${q2}"><span class="q-num">Q2 of 3</span>
    <h4>✍️ The full model intercept is −293.51. Interpret what this number represents and whether it's meaningful:</h4>
    <div class="text-input-group"><textarea class="text-input" id="${q2}_input" placeholder="The intercept represents..." rows="3"></textarea></div>
    <button class="check-btn" onclick="showSample('${q2}')">Compare to Model Answer</button>
    <div class="fb" id="${q2}_fb"></div>
  </div>

  <div class="q-block" id="${q3}"><span class="q-num">Q3 of 3</span>
    <h4>✏️ In the full model, the coefficient for <em>female</em> changes from −59.39 (bivariate) to −33.79 (with controls). Why?</h4>
    <div id="${q3}_opts">
      <button class="option-btn" onclick="checkMCQ('${q3}',0,0)">A) Part of the bivariate gender difference was confounded by the other variables (earnings, education, etc.) — once we control for those, the "net" gender difference is smaller</button>
      <button class="option-btn" onclick="checkMCQ('${q3}',1,0)">B) The bivariate model was wrong</button>
      <button class="option-btn" onclick="checkMCQ('${q3}',2,0)">C) Adding variables always reduces all coefficients</button>
    </div><div class="fb" id="${q3}_fb"></div>
  </div>`;

  attachFB(q1,' "Parallel" means the <strong>slopes are identical</strong> across groups — only intercepts differ. The vertical gap between lines equals the dummy coefficient. Interactions (Ch. 8) will allow different slopes.',' Parallel lines mean <strong>same slopes, different intercepts</strong>. The effect of schooling is identical for men and women; only the baseline level differs.');
  attachSample(q2,' "The intercept (−293.51) is the predicted distance when ALL variables equal zero: a zero-year-old African American male with no earnings, no siblings, and a mother with no schooling who is also age zero. This value is not meaningful because zero is implausible for age variables, but it is mathematically necessary for computing predictions at realistic values."');
  attachFB(q3,' This is a preview of <strong>omitted variable bias</strong> (Chapter 10). The bivariate coefficient captures both the "true" gender effect and the effects of variables correlated with gender. Adding controls removes confounding, revealing the partial effect.',' The bivariate coefficient included both the direct gender association and indirect effects through correlated variables. Controls remove confounding — the coefficient moves toward the <em>partial</em> effect.');

  window.drawPL=function(){
    var fc=+document.getElementById('fcS').value,ss=+document.getElementById('ssS').value;
    document.getElementById('fcV').textContent=fc;document.getElementById('ssV').textContent=ss;
    var cv=document.getElementById('plC'),ctx=cv.getContext('2d'),W=cv.width=cv.offsetWidth*2,H=cv.height=560;
    ctx.scale(2,2);var w=W/2,h=H/2;ctx.clearRect(0,0,w,h);ctx.fillStyle='#141720';ctx.fillRect(0,0,w,h);
    var p={l:50,r:30,t:20,b:44},pw=w-p.l-p.r,ph=h-p.t-p.b;
    var bi=71,xMin=8,xMax=17;
    var yMin=(bi+fc)+ss*xMin-30,yMax=bi+ss*xMax+30;
    function xP(x){return p.l+((x-xMin)/(xMax-xMin))*pw}
    function yP(y){return p.t+((yMax-y)/(yMax-yMin))*ph}
    ctx.strokeStyle='#2a2f42';ctx.lineWidth=1;
    for(var y=Math.ceil(yMin/50)*50;y<=yMax;y+=50){ctx.beginPath();ctx.moveTo(p.l,yP(y));ctx.lineTo(w-p.r,yP(y));ctx.stroke();ctx.fillStyle='#6a6f85';ctx.font='10px JetBrains Mono';ctx.textAlign='right';ctx.fillText(y,p.l-6,yP(y)+4)}
    for(var x=xMin;x<=xMax;x+=2){ctx.beginPath();ctx.moveTo(xP(x),p.t);ctx.lineTo(xP(x),h-p.b);ctx.stroke();ctx.fillStyle='#6a6f85';ctx.font='10px JetBrains Mono';ctx.textAlign='center';ctx.fillText(x,xP(x),h-p.b+16)}
    ctx.fillStyle='#8b90a0';ctx.font='11px DM Sans';ctx.textAlign='center';ctx.fillText("Mother's Years of Schooling",w/2,h-4);
    ctx.beginPath();ctx.strokeStyle='#6c9cfc';ctx.lineWidth=2.5;ctx.moveTo(xP(xMin),yP(bi+ss*xMin));ctx.lineTo(xP(xMax),yP(bi+ss*xMax));ctx.stroke();
    ctx.beginPath();ctx.strokeStyle='#ff6b9d';ctx.lineWidth=2.5;ctx.moveTo(xP(xMin),yP(bi+fc+ss*xMin));ctx.lineTo(xP(xMax),yP(bi+fc+ss*xMax));ctx.stroke();
    var gx=xP(12),gy1=yP(bi+ss*12),gy2=yP(bi+fc+ss*12);
    ctx.setLineDash([4,4]);ctx.strokeStyle='var(--warn)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(gx,gy1);ctx.lineTo(gx,gy2);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#ffd166';ctx.font='bold 11px JetBrains Mono';ctx.textAlign='left';ctx.fillText('Gap = '+fc,gx+8,(gy1+gy2)/2+4);
    ctx.font='bold 12px DM Sans';ctx.fillStyle='#6c9cfc';ctx.textAlign='right';ctx.fillText('Men',w-p.r-4,yP(bi+ss*xMax)-6);
    ctx.fillStyle='#ff6b9d';ctx.fillText('Women',w-p.r-4,yP(bi+fc+ss*xMax)-6);
  };setTimeout(drawPL,100);
}},

function buildNav(){document.getElementById('navList').innerHTML=MODULES.map(function(m,i){return '<div class="nav-item '+(i===currentModule?'active':'')+' '+(completed.has(i)?'completed':'')+'" onclick="goTo('+i+')"><span class="nav-dot"></span><span>'+m.title+'</span></div>'}).join('')}
